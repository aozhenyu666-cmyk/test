<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI 参谋</title>
<style>
  :root {
    --bg: #111216; --surface: #1a1c22; --surface2: #23262e; --line: #2c3039; --fg: #ececf1; --dim: #9aa1ad; --faint: #6b7280;
    --accent: #7383ff; --accent2: #a78bfa; --accent-soft: rgba(115,131,255,.14); --user: #2c3554;
    --ok: #34c38f; --warn: #f5b84a; --bad: #ef6461; --code: #0c0d10; --shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  :root[data-theme="light"] {
    --bg: #f6f7fb; --surface: #ffffff; --surface2: #eff1f6; --line: #e2e5ec; --fg: #1d2129; --dim: #646b78; --faint: #9aa0aa;
    --accent: #4f5ff5; --accent2: #8b5cf6; --accent-soft: rgba(79,95,245,.10); --user: #e7ebff;
    --code: #f1f3f7; --shadow: 0 8px 24px rgba(20,24,40,.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--fg); }
  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; max-width: 860px; margin: 0 auto; }

  /* ---------- header & tabs ---------- */
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px 6px; flex: none; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); font-size: 15px; font-weight: 700; }
  .avatar.sm { width: 26px; height: 26px; font-size: 12px; }
  .title { flex: 1; min-width: 0; }
  .title b { display: block; font-size: 16px; line-height: 1.2; }
  .title span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--bad); }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--dim); }
  .icon-btn:active { background: var(--surface2); }
  .icon-btn svg { width: 20px; height: 20px; }
  nav.tabs { display: flex; gap: 4px; margin: 2px 14px 6px; padding: 3px; background: var(--surface2); border-radius: 12px; flex: none; }
  nav.tabs button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 6px 0; font-size: 13px; color: var(--dim); }
  nav.tabs button.on { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .view { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .view.on { display: flex; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 14px 16px; }

  /* ---------- chat ---------- */
  .row { display: flex; gap: 10px; margin: 0 0 16px; }
  .row.me { justify-content: flex-end; }
  .bubble-me { max-width: 85%; background: var(--user); padding: 9px 14px; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; word-break: break-word; }
  .ai-body { flex: 1; min-width: 0; padding-top: 2px; }
  .md { word-break: break-word; }
  .md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 12px 0 6px; font-size: 15.5px; line-height: 1.4; }
  .md h1:first-child, .md h2:first-child, .md h3:first-child { margin-top: 0; }
  .md ul, .md ol { margin: 4px 0 8px; padding-left: 22px; } .md li { margin: 2px 0; }
  .md li.task { list-style: none; margin-left: -20px; }
  .md code { background: var(--code); padding: 1px 5px; border-radius: 4px; font: 12.5px ui-monospace, Menlo, Consolas, monospace; }
  .md pre { background: var(--code); padding: 10px 12px; border-radius: 10px; overflow-x: auto; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .md blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--accent); color: var(--dim); }
  .md table { border-collapse: collapse; margin: 6px 0 10px; font-size: 13.5px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .md th { background: var(--surface2); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .acts { display: flex; gap: 2px; margin-top: 4px; }
  .acts button { border: 0; background: transparent; color: var(--faint); font-size: 12px; padding: 3px 6px; border-radius: 6px; display: flex; align-items: center; gap: 4px; }
  .acts button svg { width: 14px; height: 14px; }
  .acts button:active { background: var(--surface2); }
  .steps { margin: 0 0 8px; font-size: 12.5px; color: var(--dim); }
  .steps summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px;
    background: var(--surface2); border-radius: 999px; }
  .steps summary::-webkit-details-marker { display: none; }
  .steps .spin { width: 12px; height: 12px; border: 2px solid var(--faint); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  .steps ul { list-style: none; margin: 6px 0 0; padding: 0 0 0 4px; }
  .steps li { margin: 3px 0; display: flex; gap: 6px; }
  .steps li.fail { color: var(--bad); }
  .steps li small { color: var(--faint); word-break: break-all; }
  .diag { margin: 0 0 8px; font-size: 12.5px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  .diag summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline; }
  .diag summary::-webkit-details-marker { display: none; }
  .diag summary i { font-style: normal; flex: none; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: #fff; }
  .diag summary span { font-weight: 600; }
  .diag div { margin: 6px 0 0; color: var(--dim); }
  .diag div b { display: inline-block; min-width: 3.2em; margin-right: 6px; color: var(--faint); font-weight: 500; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .choices button { border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  .choices button:disabled { opacity: .45; }
  .confirm { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .confirm .btns { display: flex; gap: 8px; margin-top: 10px; }
  .typing { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; animation: blink 1.2s infinite both; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err-card { margin: 0 0 14px; padding: 10px 12px; border-radius: 12px; background: rgba(239,100,97,.10); border: 1px solid rgba(239,100,97,.35); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .note { text-align: center; color: var(--faint); font-size: 12px; margin: 0 0 14px; white-space: pre-wrap; }

  .hero { padding: 18px 4px 6px; }
  .hero h2 { margin: 0 0 4px; font-size: 22px; }
  .hero p { margin: 0 0 14px; color: var(--dim); }
  .stat-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .stat { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 9px 13px; min-width: 104px; }
  .stat b { display: block; font-size: 19px; line-height: 1.25; }
  .stat span { font-size: 12px; color: var(--dim); }
  .starter { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .starter button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 11px 12px; }
  .starter button b { display: block; font-size: 14px; }
  .starter button span { font-size: 12px; color: var(--dim); }

  .composer { flex: none; padding: 6px 12px calc(10px + env(safe-area-inset-bottom)); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--dim); }
  .inputbox { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 6px 6px 6px 16px; box-shadow: var(--shadow); }
  .inputbox textarea { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; resize: none; padding: 7px 0; max-height: 34vh; line-height: 1.5; }
  .send { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  .send:disabled { background: var(--surface2); color: var(--faint); }
  .send svg { width: 18px; height: 18px; }
  .send.stop { background: var(--fg); color: var(--bg); }

  /* ---------- cards (today / goals / settings) ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 0 0 12px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card h3 .sp { flex: 1; }
  .card h3 small { font-weight: 400; color: var(--dim); font-size: 12px; }
  .muted { color: var(--dim); font-size: 13px; }
  .btn { border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 7px 12px; font-size: 13px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--bad); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .daynav { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; }
  .daynav b { flex: 1; text-align: center; font-size: 16px; }
  .countdowns { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 12px; }
  .cd { flex: none; border-radius: 14px; padding: 8px 12px; background: var(--accent-soft); min-width: 108px; }
  .cd b { font-size: 20px; } .cd span { display: block; font-size: 12px; color: var(--dim); }
  .plan-item { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px dashed var(--line); }
  .plan-item:first-of-type { border-top: 0; }
  .check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--faint); flex: none; margin-top: 3px; display: grid; place-items: center; }
  .check.on { background: var(--ok); border-color: var(--ok); color: #fff; font-size: 11px; }
  .plan-item .t { flex: 1; } .plan-item .t small { display: block; color: var(--dim); font-size: 12px; }
  .done-t { text-decoration: line-through; color: var(--dim); }
  .bars { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--surface2); margin: 8px 0; }
  .legend { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
  .timeline { position: relative; height: 26px; background: var(--surface2); border-radius: 7px; margin: 10px 0 4px; overflow: hidden; }
  .timeline .seg { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; min-width: 2px; }
  .timeline .seg.away { top: 0; bottom: 0; background: repeating-linear-gradient(45deg, rgba(160,160,160,.55) 0 3px, transparent 3px 6px); }
  .ticks { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--faint); }
  .seglist { margin-top: 8px; font-size: 13px; }
  .seglist div { display: flex; gap: 8px; padding: 3px 0; }
  .seglist time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .kv dt { color: var(--dim); } .kv dd { margin: 0; white-space: pre-wrap; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface2); color: var(--dim); }
  .pill.on { background: var(--accent-soft); color: var(--accent); }

  .goal { cursor: pointer; }
  .goal-head { display: flex; align-items: center; gap: 10px; }
  .goal-emoji { width: 38px; height: 38px; border-radius: 12px; background: var(--surface2); display: grid; place-items: center; font-size: 20px; flex: none; }
  .goal-head .t { flex: 1; min-width: 0; }
  .goal-head .t b { display: block; }
  .goal-head .t span { font-size: 12.5px; color: var(--dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .goal-days { text-align: right; } .goal-days b { font-size: 20px; display: block; line-height: 1.1; } .goal-days span { font-size: 11px; color: var(--dim); }
  .goal-body { margin-top: 12px; display: none; }
  .goal.open .goal-body { display: block; }
  .ms { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 3px 0; }

  .field { margin: 0 0 10px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin: 0 0 4px; }
  .field input, .field select, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 14px; outline: none; }
  .field textarea { resize: vertical; min-height: 64px; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .switch { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .switch:first-of-type { border-top: 0; }
  .switch .t { flex: 1; } .switch .t small { display: block; color: var(--dim); font-size: 12px; }
  .switch select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 13px; }
  .provider-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; margin-bottom: 10px; }
  .provider-grid button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px; font-size: 13px; }
  .provider-grid button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .status-line { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; padding: 8px 10px; border-radius: 10px; background: var(--surface2); margin-top: 10px; white-space: pre-wrap; word-break: break-word; }
  .status-line .dot { margin-top: 6px; }
  .empty-hint { text-align: center; color: var(--dim); font-size: 13px; padding: 14px 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">参</div>
    <div class="title"><b>AI 参谋</b><span><i class="dot" id="dot"></i><em id="meta" style="font-style:normal">未配置</em></span></div>
    <button class="icon-btn" id="btnNew" title="新对话" aria-label="新对话"></button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="chat" class="on">对话</button>
    <button data-tab="today">今日</button>
    <button data-tab="goals">目标</button>
    <button data-tab="settings">设置</button>
  </nav>

  <section class="view on" id="view-chat">
    <div class="scroll" id="log"></div>
    <div class="composer">
      <div class="chips" id="chips"></div>
      <div class="inputbox">
        <textarea id="input" rows="1" placeholder="和参谋说点什么（可用输入法语音输入）"></textarea>
        <button class="send" id="btnSend" aria-label="发送"></button>
      </div>
    </div>
  </section>

  <section class="view" id="view-today"><div class="scroll" id="today"></div></section>
  <section class="view" id="view-goals"><div class="scroll" id="goals"></div></section>
  <section class="view" id="view-settings"><div class="scroll" id="settings"></div></section>
</div>

<script>
(function () {
  'use strict';

  const API = window.PluginAPI;
  const VERSION = '0.4.0';
  const LS_KEY = 'sp-ai-assistant:v1';
  const LS = 'sp-ai-assistant:';
  const MAX_ROUNDS = 10;
  const KEEP_USER_TURNS = 10;
  const FULL_TOOL_TURNS = 2;
  const TOOL_RESULT_MAX = 6000;
  const LLM_TIMEOUT = 120000;
  const RITUAL_PREFIX = '🧭 参谋';

  const ICON = {
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    retry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  };

  const PRESETS = [
    { id: 'deepseek', label: 'DeepSeek', base: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
    { id: 'dashscope', label: '通义千问', base: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-plus' },
    { id: 'moonshot', label: 'Kimi', base: 'https://api.moonshot.cn/v1', model: '' },
    { id: 'zhipu', label: '智谱 GLM', base: 'https://open.bigmodel.cn/api/paas/v4', model: '' },
    { id: 'siliconflow', label: '硅基流动', base: 'https://api.siliconflow.cn/v1', model: '' },
    { id: 'openrouter', label: 'OpenRouter', base: 'https://openrouter.ai/api/v1', model: '' },
    { id: 'openai', label: 'OpenAI', base: 'https://api.openai.com/v1', model: '' },
    { id: 'anthropic', label: 'Claude', base: 'https://api.anthropic.com/v1', model: '' },
    { id: 'custom', label: '自定义 / 网关', base: '', model: '' },
  ];

  const DEFAULT_SETTINGS = {
    morningTime: '08:30', eveningTime: '21:30',
    awayCheck: null, awayMinutes: 10, ritualTask: null, openPrompt: true, timeline: null, diagnose: true,
  };

  // 案卷条目的种类；没有 kind 的老条目当作 pref
  const MEMORY_KINDS = { pref: '偏好', commit: '承诺', pattern: '反复' };
  const memoryLine = (m) => '[' + MEMORY_KINDS[m.kind || 'pref'] + ' ' + String(m.at || '').slice(5) + '] ' + m.text;

  const GOAL_COLORS = ['#7383ff', '#34c38f', '#f5b84a', '#ef6461', '#22b8cf', '#c084fc', '#f97316', '#84cc16'];

  // 国考 / 四川省考：日期按往年规律估算，公告出来后请在“目标”页改成官方日期
  const DEFAULT_GOALS = [
    { id: 'study', emoji: '📚', title: '学习', tag: '学习', why: '', focus: '', targetDate: '', keyDates: [], milestones: [] },
    { id: 'job', emoji: '💼', title: '找工作', tag: '求职', why: '', focus: '', targetDate: '', keyDates: [], milestones: [] },
    { id: 'mind', emoji: '🧠', title: '思维习惯突破', tag: '思维', why: '', focus: '', targetDate: '', keyDates: [], milestones: [] },
    { id: 'social', emoji: '🤝', title: '社交突破', tag: '社交', why: '', focus: '', targetDate: '', keyDates: [], milestones: [] },
    {
      id: 'guokao', emoji: '🏛️', title: '国考（2027 年度）', tag: '国考', why: '', focus: '', targetDate: '2026-11-29',
      keyDates: [
        { label: '公告', date: '2026-10-14', estimated: true },
        { label: '报名截止', date: '2026-10-24', estimated: true },
        { label: '笔试', date: '2026-11-29', estimated: true },
      ],
      milestones: [],
    },
    {
      id: 'sckao', emoji: '🏔️', title: '四川省考（2027 年度）', tag: '省考', why: '', focus: '', targetDate: '2026-12-06',
      keyDates: [
        { label: '公告', date: '2026-10-30', estimated: true },
        { label: '报名', date: '2026-11-05', estimated: true },
        { label: '笔试', date: '2026-12-06', estimated: true },
      ],
      milestones: [],
    },
  ];

  let cfg = { preset: 'deepseek', llmBase: '', apiKey: '', model: '', mcpUrl: '', mcpToken: '', transport: 'auto', stream: true };
  const state = {
    history: [], busy: false, abort: null, mcp: null, goodTransport: {}, streamOk: {},
    tab: 'chat', todayDay: null, openGoal: null,
  };

  const $ = (id) => document.getElementById(id);
  const els = { log: $('log'), input: $('input'), send: $('btnSend'), chips: $('chips'), dot: $('dot'), meta: $('meta') };

  // ================================================================== utils

  const pad = (n) => (n < 10 ? '0' : '') + n;
  const ymd = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const hm = (d = new Date()) => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const fmtTs = (ms) => { const d = new Date(ms); return ymd(d) + ' ' + hm(d); };
  const WEEK = '日一二三四五六';
  const weekday = (day) => '周' + WEEK.charAt(parseDayDate(day).getDay());
  const parseDayDate = (day) => { const p = day.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
  const addDays = (day, n) => { const d = parseDayDate(day); d.setDate(d.getDate() + n); return ymd(d); };
  const daysUntil = (day) => Math.round((parseDayDate(day) - parseDayDate(ymd())) / 86400000);
  const minutes = (ms) => (ms ? Math.round(ms / 60000) : 0);
  const fmtDur = (ms) => { const m = minutes(ms); if (m < 60) return m + ' 分'; return Math.floor(m / 60) + ' 小时' + (m % 60 ? ' ' + (m % 60) + ' 分' : ''); };
  const errMsg = (e) => (e && (e.message || e.error)) || String(e);
  const h = (s) => String(s == null ? '' : s).replace(/[<>&"']/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[c]));
  function compact(o) {
    Object.keys(o).forEach((k) => { const v = o[k]; if (v === undefined || v === null || v === '' || v === false || (Array.isArray(v) && !v.length)) delete o[k]; });
    return o;
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function lsRead() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function lsWrite(patch) { try { const cur = lsRead(); Object.assign(cur, patch); localStorage.setItem(LS_KEY, JSON.stringify(cur)); } catch (e) { /* ignore */ } }
  function lsGet(k, def) { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }

  function abortError() { const e = new Error('已停止'); e.aborted = true; return e; }
  function abortable(p, signal) {
    if (!signal) return p;
    return new Promise((resolve, reject) => {
      if (signal.aborted) return reject(abortError());
      const on = () => reject(abortError());
      signal.addEventListener('abort', on, { once: true });
      p.then((v) => { signal.removeEventListener('abort', on); resolve(v); }, (e) => { signal.removeEventListener('abort', on); reject(e); });
    });
  }
  function withTimeout(p, ms, what) {
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error((what || '请求') + '超时（' + Math.round(ms / 1000) + ' 秒）')), ms);
      Promise.resolve(p).then((v) => { clearTimeout(t); resolve(v); }, (e) => { clearTimeout(t); reject(e); });
    });
  }

  // ================================================================== synced data (goals / journal / log / settings)

  async function loadKey(key, def) {
    if (!API || typeof API.loadSyncedData !== 'function') return lsGet('mem-' + key, def);
    try { const raw = await API.loadSyncedData(key); return raw ? JSON.parse(raw) : def; } catch (e) { return def; }
  }
  async function saveKey(key, val) {
    if (!API || typeof API.persistDataSynced !== 'function') return lsSet('mem-' + key, val);
    return API.persistDataSynced(JSON.stringify(val), key);
  }

  async function getSettings() { return Object.assign({}, DEFAULT_SETTINGS, (await loadKey('settings', {})) || {}); }

  async function getGoalsDoc() {
    let doc = await loadKey('goals', null);
    if (!doc || !Array.isArray(doc.goals)) {
      doc = { goals: JSON.parse(JSON.stringify(DEFAULT_GOALS)), memory: [] };
      await saveKey('goals', doc);
    }
    doc.memory = doc.memory || [];
    return doc;
  }
  const saveGoalsDoc = (doc) => saveKey('goals', doc);

  async function getJournalMonth(day) { const j = await loadKey('journal-' + day.slice(0, 7), { days: {} }); j.days = j.days || {}; return j; }
  async function getDay(day) { return (await getJournalMonth(day)).days[day] || {}; }
  async function patchDay(day, fn) {
    const j = await getJournalMonth(day);
    j.days[day] = j.days[day] || {};
    fn(j.days[day]);
    await saveKey('journal-' + day.slice(0, 7), j);
    return j.days[day];
  }
  async function getLog(day) {
    const l = await loadKey('log-' + day.slice(0, 7), { days: {} });
    const d = (l.days || {})[day] || {};
    const res = { segs: (d.segs || []).slice(), away: (d.away || []).slice() };
    // 正在进行中的计时段（只在本设备的 localStorage 里）
    const open = lsGet('open', null);
    if (open && ymd(new Date(open.s)) === day) res.segs.push({ s: open.s, e: Date.now(), taskId: open.taskId, title: open.title, live: true });
    return res;
  }

  // ================================================================== SP data helpers

  function need(fn) {
    if (!API || typeof API[fn] !== 'function') throw new Error('当前 SP 版本的插件 API 不支持 ' + fn);
    return API[fn].bind(API);
  }

  async function loadLookups() {
    const [projects, tags] = await Promise.all([need('getAllProjects')(), need('getAllTags')()]);
    const lk = { projects: {}, tags: {}, tagByTitle: {} };
    (projects || []).forEach((p) => { lk.projects[p.id] = p; });
    (tags || []).forEach((t) => { lk.tags[t.id] = t; lk.tagByTitle[String(t.title).toLowerCase()] = t; });
    return lk;
  }

  function resolveByName(map, key, kind) {
    const list = Object.values(map);
    if (map[key]) return map[key];
    const low = String(key).trim().toLowerCase();
    const exact = list.filter((x) => String(x.title).toLowerCase() === low);
    if (exact.length === 1) return exact[0];
    const partial = list.filter((x) => String(x.title).toLowerCase().includes(low));
    if (partial.length === 1) return partial[0];
    throw new Error((partial.length > 1 ? kind + '「' + key + '」不唯一' : '找不到' + kind + '「' + key + '」') + '。现有' + kind + '：' + list.map((x) => x.title).slice(0, 30).join('、'));
  }

  function parseDay(s) {
    if (!s) return null;
    const v = String(s).trim().toLowerCase();
    if (v === 'today' || v === '今天') return ymd();
    if (v === 'tomorrow' || v === '明天') return addDays(ymd(), 1);
    if (v === '后天') return addDays(ymd(), 2);
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    throw new Error('日期要用 YYYY-MM-DD（或 today / tomorrow），收到：' + s);
  }
  function parseTime(day, t) {
    if (!/^\d{1,2}:\d{2}$/.test(String(t))) throw new Error('时间要用 HH:MM，收到：' + t);
    const [H, M] = String(t).split(':');
    const d = parseDayDate(day); d.setHours(+H, +M, 0, 0); return d.getTime();
  }
  // "2026-10-03 15:00" / "15:00" / "tomorrow 09:30"
  function parseWhen(s) {
    const m = String(s).trim().match(/^(?:(\S+)\s+)?(\d{1,2}:\d{2})$/);
    if (!m) throw new Error('提醒时间格式：YYYY-MM-DD HH:MM 或 HH:MM，收到：' + s);
    return parseTime(m[1] ? parseDay(m[1]) : ymd(), m[2]);
  }
  const isDueOn = (t, day) => (t.dueWithTime ? ymd(new Date(t.dueWithTime)) === day : t.dueDay === day);
  const dueOf = (t) => (t.dueWithTime ? fmtTs(t.dueWithTime) : t.dueDay || null);
  const isRitual = (t) => String(t.title || '').indexOf(RITUAL_PREFIX) === 0;

  function briefTask(t, lk, withNotes) {
    const today = ymd();
    const live = lsGet('live', null);
    return compact({
      id: t.id, title: t.title, done: !!t.isDone,
      project: t.projectId && lk.projects[t.projectId] ? lk.projects[t.projectId].title : null,
      tags: (t.tagIds || []).filter((id) => lk.tags[id] && id !== 'TODAY').map((id) => lk.tags[id].title),
      due: dueOf(t),
      deadline: t.deadlineWithTime ? fmtTs(t.deadlineWithTime) : t.deadlineDay || null,
      remind: t.remindAt ? fmtTs(t.remindAt) : null,
      priority: t.priority || null,
      estimateMin: minutes(t.timeEstimate) || null,
      spentMin: minutes(t.timeSpent) || null,
      spentTodayMin: minutes(t.timeSpentOnDay && t.timeSpentOnDay[today]) || null,
      parentId: t.parentId || null,
      subtasks: (t.subTaskIds || []).length || null,
      running: (live && live.taskId === t.id) || null,
      notes: withNotes && t.notes ? String(t.notes).slice(0, 300) : null,
    });
  }

  async function findTask(id) {
    const all = await need('getTasks')();
    const t = (all || []).find((x) => x.id === id);
    if (!t) throw new Error('找不到任务 ' + id + '（先用 list_tasks 查 id）');
    return t;
  }

  async function tagIdsByName(names, lk) {
    const ids = [];
    for (const raw of names) {
      const name = String(raw).replace(/^#/, '').trim();
      if (!name) continue;
      const hit = lk.tagByTitle[name.toLowerCase()];
      if (hit) { ids.push(hit.id); continue; }
      const id = await need('addTag')({ title: name });
      lk.tags[id] = { id, title: name }; lk.tagByTitle[name.toLowerCase()] = lk.tags[id];
      ids.push(id);
    }
    return ids;
  }

  function goalByKey(doc, key) {
    if (!key) return null;
    const low = String(key).trim().toLowerCase();
    return doc.goals.find((g) => g.id === key) ||
      doc.goals.find((g) => g.title.toLowerCase() === low || String(g.tag).toLowerCase() === low) ||
      doc.goals.find((g) => g.title.toLowerCase().includes(low)) || null;
  }

  // 任务 → 目标：任务带了目标的标签就算该目标的投入
  function goalOfTask(t, goals, lk) {
    for (let i = 0; i < goals.length; i++) {
      const tag = goals[i].tag && lk.tagByTitle[String(goals[i].tag).toLowerCase()];
      if (tag && (t.tagIds || []).includes(tag.id)) return goals[i];
    }
    return null;
  }

  async function timeByGoal(days, includeArchived) {
    const [tasks, archived, lk, doc] = await Promise.all([
      need('getTasks')(), includeArchived && API.getArchivedTasks ? API.getArchivedTasks().catch(() => []) : [], loadLookups(), getGoalsDoc(),
    ]);
    const all = (tasks || []).concat(archived || []);
    const out = {}; let total = 0;
    all.forEach((t) => {
      if (t.subTaskIds && t.subTaskIds.length) return; // 父任务时间是子任务之和，避免重复
      let ms = 0;
      days.forEach((d) => { ms += (t.timeSpentOnDay && t.timeSpentOnDay[d]) || 0; });
      if (!ms) return;
      const parent = t.parentId && all.find((x) => x.id === t.parentId);
      const g = goalOfTask(t, doc.goals, lk) || (parent && goalOfTask(parent, doc.goals, lk));
      const k = g ? g.id : '_other';
      out[k] = (out[k] || 0) + ms; total += ms;
    });
    return { byGoal: out, total, goals: doc.goals };
  }

  // ================================================================== network (3 channels, abortable)
  //
  //  native : 宿主窗口的 fetch。安卓/iOS 上被 CapacitorHttp 替换成原生 HTTP —— 无 CORS、可访问局域网、无 30 秒限制
  //  fetch  : iframe 自己的 fetch，受 CORS 约束；唯一能做流式输出的通道
  //  proxy  : PluginAPI.request，只能访问 manifest.allowedHosts 的公网域名，单次 30 秒，读不到响应头

  function hostWindow() {
    try { const w = window.parent; if (w && w !== window && typeof w.fetch === 'function') return w; } catch (e) { /* cross-origin */ }
    return null;
  }
  function isNativeHost() {
    try { const C = window.parent && window.parent.Capacitor; if (C && typeof C.isNativePlatform === 'function') return !!C.isNativePlatform(); } catch (e) { /* ignore */ }
    const p = API && API.cfg && API.cfg.platform;
    return p === 'android' || p === 'ios';
  }
  function transportOrder(origin, needHeaders) {
    let order = cfg.transport !== 'auto' ? [cfg.transport] : (isNativeHost() && hostWindow() ? ['native', 'fetch', 'proxy'] : ['fetch', 'native', 'proxy']);
    const good = state.goodTransport[origin];
    if (good && order.indexOf(good) > 0 && !(needHeaders && good === 'proxy')) order = [good].concat(order.filter((t) => t !== good));
    return order;
  }
  const TRANSPORT_NAME = { native: '原生 HTTP', fetch: '浏览器 fetch', proxy: 'SP 宿主代理' };

  async function viaFetch(win, url, opt) {
    const init = { method: opt.method, headers: opt.headers, body: opt.body };
    const res = await abortable(withTimeout(win.fetch.call(win, url, init), opt.timeout), opt.signal);
    const text = await abortable(withTimeout(res.text(), opt.timeout), opt.signal);
    return { status: res.status, text, header: (n) => { try { return res.headers.get(n); } catch (e) { return null; } } };
  }
  async function viaProxy(url, opt) {
    if (!API || typeof API.request !== 'function') throw new Error('没有 PluginAPI.request');
    const data = await abortable(withTimeout(API.request(url, { method: opt.method, headers: opt.headers, body: opt.body, timeout: Math.min(opt.timeout, 120000), responseType: 'text' }), Math.min(opt.timeout, 31000), 'SP 宿主代理'), opt.signal);
    return { status: 200, text: typeof data === 'string' ? data : JSON.stringify(data), header: () => null };
  }
  function runTransport(t, url, opt) {
    if (t === 'native' || t === 'fetch') {
      const w = t === 'native' ? hostWindow() : window;
      if (!w) return Promise.reject(new Error('当前环境没有宿主窗口'));
      return viaFetch(w, url, opt);
    }
    if (t === 'proxy') return viaProxy(url, opt);
    return Promise.reject(new Error('未知通道 ' + t));
  }
  // 只有“连不上”才换通道；拿到任何 HTTP 状态码都说明通道是通的
  async function http(url, opt) {
    opt = Object.assign({ method: 'GET', headers: {}, timeout: 30000 }, opt);
    let origin; try { origin = new URL(url).origin; } catch (e) { throw new Error('地址无效：' + url); }
    const errors = [];
    for (const t of transportOrder(origin, opt.needHeaders)) {
      try {
        const r = await runTransport(t, url, opt);
        if (!(opt.needHeaders && t === 'proxy')) state.goodTransport[origin] = t;
        r.transport = t;
        return r;
      } catch (e) {
        if (e.aborted) throw e;
        const m = errMsg(e);
        errors.push('· ' + TRANSPORT_NAME[t] + '：' + m);
        if (/超时/.test(m) && t !== 'proxy') throw new Error(m + '（' + TRANSPORT_NAME[t] + '）');
      }
    }
    throw new Error('连不上 ' + origin + '：\n' + errors.join('\n'));
  }
  function parseJson(r, what) {
    try { return JSON.parse(r.text); } catch (e) { throw new Error(what + '返回的不是 JSON（HTTP ' + r.status + '）：' + String(r.text).slice(0, 200)); }
  }

  // ================================================================== LLM

  const llmUrl = (p) => cfg.llmBase.replace(/\/+$/, '') + p;
  function llmHeaders() { const h2 = { 'Content-Type': 'application/json' }; if (cfg.apiKey) h2.Authorization = 'Bearer ' + cfg.apiKey; return h2; }
  function llmError(status, text) {
    let em = '';
    try { const d = JSON.parse(text); em = d.error && (d.error.message || d.error.msg || JSON.stringify(d.error)); } catch (e) { /* ignore */ }
    const hint = status === 401 ? '\n（API Key 不对或已失效）' : status === 402 ? '\n（账户余额不足）' : status === 429 ? '\n（请求太频繁或额度用完，稍后再试）' : '';
    return new Error('模型接口报错（HTTP ' + status + '）：' + (em || String(text).slice(0, 300)) + hint);
  }

  function chatBody(messages, tools, stream) {
    const body = { model: cfg.model, messages, temperature: 0.4, stream };
    if (tools.length) { body.tools = tools; body.tool_choice = 'auto'; }
    return body;
  }

  async function chatBuffered(messages, tools, signal) {
    const r = await http(llmUrl('/chat/completions'), { method: 'POST', headers: llmHeaders(), body: JSON.stringify(chatBody(messages, tools, false)), timeout: LLM_TIMEOUT, signal });
    if (r.status >= 400) throw llmError(r.status, r.text);
    const data = parseJson(r, '模型接口');
    if (data.error) throw llmError(r.status, r.text);
    const msg = data.choices && data.choices[0] && data.choices[0].message;
    if (!msg) throw new Error('模型没有返回内容：' + String(r.text).slice(0, 300));
    return msg;
  }

  // 流式：只有 iframe 自己的 fetch 能逐块读；服务商不允许 CORS 时会立刻失败，然后改走非流式
  async function chatStream(messages, tools, signal, onText) {
    let res;
    try {
      res = await abortable(withTimeout(fetch(llmUrl('/chat/completions'), { method: 'POST', headers: llmHeaders(), body: JSON.stringify(chatBody(messages, tools, true)), signal }), 30000, '连接模型'), signal);
    } catch (e) {
      if ((signal && signal.aborted) || e.aborted) throw abortError();
      const ne = new Error(errMsg(e)); ne.network = true; throw ne;
    }
    if (res.status >= 400) throw llmError(res.status, await res.text());
    if (!res.body || !/event-stream/i.test(res.headers.get('content-type') || '')) {
      const text = await res.text();
      const d = JSON.parse(text);
      return d.choices[0].message;
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', content = '', calls = [], lastChunk = Date.now();
    const idle = setInterval(() => { if (Date.now() - lastChunk > 60000) reader.cancel().catch(() => {}); }, 5000);
    try {
      for (;;) {
        const { done, value } = await abortable(reader.read(), signal).catch((e) => { reader.cancel().catch(() => {}); throw e; });
        if (done) break;
        lastChunk = Date.now();
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          let j; try { j = JSON.parse(data); } catch (e) { continue; }
          if (j.error) throw llmError(500, data);
          const delta = j.choices && j.choices[0] && j.choices[0].delta;
          if (!delta) continue;
          if (delta.content) { content += delta.content; onText(content); }
          (delta.tool_calls || []).forEach((tc) => {
            const i = tc.index != null ? tc.index : calls.length;
            const c = calls[i] = calls[i] || { id: '', type: 'function', function: { name: '', arguments: '' } };
            if (tc.id) c.id = tc.id;
            if (tc.function && tc.function.name) c.function.name += tc.function.name;
            if (tc.function && tc.function.arguments) c.function.arguments += tc.function.arguments;
          });
        }
      }
    } finally { clearInterval(idle); }
    if (signal && signal.aborted) throw abortError();
    calls = calls.filter(Boolean);
    return { role: 'assistant', content: content || null, tool_calls: calls.length ? calls : undefined };
  }

  async function chat(messages, tools, signal, onText) {
    let origin = ''; try { origin = new URL(cfg.llmBase).origin; } catch (e) { /* handled by http */ }
    const remembered = lsGet('streamOk', {});
    const canStream = cfg.stream !== false && (cfg.transport === 'auto' || cfg.transport === 'fetch') && remembered[origin] !== false;
    if (canStream) {
      try {
        const m = await chatStream(messages, tools, signal, onText);
        if (remembered[origin] !== true) { remembered[origin] = true; lsSet('streamOk', remembered); }
        return m;
      } catch (e) {
        if (!e.network) throw e;
        remembered[origin] = false; lsSet('streamOk', remembered); // 记住：这家不允许浏览器直连，以后直接走非流式
      }
    }
    return chatBuffered(messages, tools, signal);
  }

  async function fetchModels() {
    const r = await http(llmUrl('/models'), { headers: llmHeaders(), timeout: 20000 });
    if (r.status >= 400) throw llmError(r.status, r.text);
    const data = parseJson(r, '模型列表接口');
    return ((data && data.data) || []).map((m) => m.id).filter(Boolean).sort();
  }

  // ================================================================== MCP client (Streamable HTTP)

  class McpClient {
    constructor(url, token) { this.url = url; this.token = token; this.sid = null; this.protocol = null; this.tools = []; this.nextId = 1; }
    async _post(msg) {
      const hd = { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream' };
      if (this.token) hd.Authorization = 'Bearer ' + this.token;
      if (this.sid) hd['Mcp-Session-Id'] = this.sid;
      if (this.protocol) hd['MCP-Protocol-Version'] = this.protocol;
      const r = await http(this.url, { method: 'POST', headers: hd, body: JSON.stringify(msg), timeout: 60000, needHeaders: true });
      this.transport = r.transport;
      const sid = r.header('mcp-session-id');
      if (sid) this.sid = sid;
      if (msg.id === undefined) return null;
      if (r.status === 404 && this.sid) { const e = new Error('MCP 会话已失效'); e.sessionExpired = true; throw e; }
      if (r.status === 401 || r.status === 403) throw new Error('MCP 服务器拒绝访问（HTTP ' + r.status + '），检查 Token');
      const reply = McpClient.pickReply(r.text, msg.id, r.header('content-type'));
      if (!reply) throw new Error('MCP 无法解析响应（HTTP ' + r.status + '）：' + String(r.text).slice(0, 200));
      if (reply.error) throw new Error('MCP 错误：' + (reply.error.message || JSON.stringify(reply.error)));
      return reply.result;
    }
    static pickReply(text, id, ctype) {
      const body = String(text || '').trim();
      if (!body) return null;
      const cands = [];
      if (/event-stream/i.test(ctype || '') || (/^(event|data|id|:)/m.test(body) && body[0] !== '{' && body[0] !== '[')) {
        body.split(/\r?\n\r?\n/).forEach((block) => {
          const data = block.split(/\r?\n/).filter((l) => l.indexOf('data:') === 0).map((l) => l.slice(5).replace(/^ /, '')).join('\n');
          if (data) { try { cands.push(JSON.parse(data)); } catch (e) { /* skip */ } }
        });
      } else {
        try { cands.push(JSON.parse(body)); } catch (e) { return null; }
      }
      const flat = [].concat(...cands.map((c) => (Array.isArray(c) ? c : [c])));
      return flat.find((m) => m && m.id === id && (m.result !== undefined || m.error)) || null;
    }
    request(method, params) { return this._post({ jsonrpc: '2.0', id: this.nextId++, method, params: params || {} }); }
    async connect() {
      this.sid = null; this.protocol = null;
      try {
        const res = await this.request('initialize', { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'sp-ai-assistant', version: VERSION } });
        this.protocol = (res && res.protocolVersion) || '2025-06-18';
        this.serverName = (res && res.serverInfo && res.serverInfo.name) || 'MCP';
        await this._post({ jsonrpc: '2.0', method: 'notifications/initialized' });
        let cursor, acc = [];
        do {
          const r = await this.request('tools/list', cursor ? { cursor } : {});
          acc = acc.concat((r && r.tools) || []); cursor = r && r.nextCursor;
        } while (cursor && acc.length < 200);
        this.tools = acc;
        return acc;
      } catch (e) {
        if (this.transport === 'proxy' && !this.sid) {
          e.message = errMsg(e) + '\n（当前走的是 SP 宿主代理，读不到 Mcp-Session-Id。有状态的 MCP 服务器需要在手机上走原生 HTTP，或开启 CORS 并暴露该响应头）';
        }
        throw e;
      }
    }
    async callTool(name, args, retried) {
      try {
        const res = await this.request('tools/call', { name, arguments: args || {} });
        let text = ((res && res.content) || []).map((c) => (c.type === 'text' ? c.text : '[' + c.type + ']')).join('\n');
        if (!text && res && res.structuredContent) text = JSON.stringify(res.structuredContent);
        if (res && res.isError) throw new Error(text || '远程工具执行失败');
        return text || '(无输出)';
      } catch (e) {
        if (e.sessionExpired && !retried) { await this.connect(); return this.callTool(name, args, true); }
        throw e;
      }
    }
  }

    if (!cfg.mcpUrl) { state.mcp = null; return null; }
    if (state.mcp && state.mcp.url === cfg.mcpUrl && state.mcp.ready) return state.mcp;
    if (state.mcpFailedAt && Date.now() - state.mcpFailedAt < 5 * 60000) return null; // 失败后 5 分钟内不再重试，免得每句话都卡一下
    const c = new McpClient(cfg.mcpUrl, cfg.mcpToken);
    try {
      await c.connect();
      c.ready = true; state.mcp = c; state.mcpFailedAt = 0;
      return c;
    } catch (e) {
      state.mcp = null; state.mcpFailedAt = Date.now();
      addNote('MCP 未连接，本次只用本机工具：' + errMsg(e));
      return null;

      name: 'save_daily_review', label: () => '保存复盘并生成日报',
      description: '保存当天复盘，生成日报并写进 SP（今天的「🧭 参谋」任务备注）。',
      parameters: P({
        date: S('默认今天'), wins: S('完成了什么/做得好的'), problems: S('卡在哪/没完成的原因'), lessons: S('学到/想改进的'),
        tomorrow: S('明天第一件事'), mood: { type: 'integer', description: '心情 1-5' }, energy: { type: 'integer', description: '精力 1-5' },
      }),
      run: async (a) => {
        const day = a.date ? parseDay(a.date) : ymd();
        await patchDay(day, (d) => { d.review = compact({ wins: a.wins, problems: a.problems, lessons: a.lessons, tomorrow: a.tomorrow, mood: a.mood, energy: a.energy, at: Date.now() }); });
        const where = await writeReportToSp(day);
        refreshSideViews();
        return { ok: true, date: day, report: where };
      },
    },
    {
      name: 'get_history', label: (a) => '回顾最近 ' + (a.days || 7) + ' 天',
      description: '最近 N 天的计划、复盘和每天投入时间，用于周复盘/周计划。',
      parameters: P({ days: { type: 'integer', description: '默认 7，最多 31' } }),
      run: async (a) => {
        const n = Math.max(1, Math.min(Number(a.days) || 7, 31));
        const days = Array.from({ length: n }, (_, i) => addDays(ymd(), -i)).reverse();
        const tg = await Promise.all(days.map((d) => timeByGoal([d], true)));
        const journals = await Promise.all(days.map(getDay));
        return days.map((d, i) => compact({
          date: d + ' ' + weekday(d), timeMin: minutes(tg[i].total),
          theme: journals[i].plan && journals[i].plan.theme,
          planItems: journals[i].plan ? (journals[i].plan.items || []).length : null,
          review: journals[i].review ? compact({ wins: journals[i].review.wins, problems: journals[i].review.problems, tomorrow: journals[i].review.tomorrow, mood: journals[i].review.mood }) : null,
        }));
      },
    },
    {
      name: 'ask_user', label: (a) => '提问：' + a.question,
      description: '向用户提一个问题并给出 2-6 个可以一点就答的选项（用户也可以自己打字）。调用后等用户回答，本轮不要再说别的。',
      parameters: P({ question: S(), options: { type: 'array', items: { type: 'string' } } }, ['question', 'options']),
      run: async (a, ctx) => { ctx.showChoices(a.question, a.options || []); return { shown: true, note: '已展示给用户，等待回答' }; },
      endsTurn: true,
    },
    {
      name: 'remember', label: (a) => (a.forget ? '忘记：' : '记住：') + (a.fact || a.forget),
      description: '把关于用户的事记进案卷，以后每次对话都会带上。kind：pref=偏好/约束（如“晚上 10 点后效率低”，默认）；commit=用户说要做的事（写清做什么、哪天前）；pattern=反复出现的说法或抱怨（第二次出现时记）。forget 填关键字可删除。',
      parameters: P({ fact: S(), kind: { type: 'string', enum: Object.keys(MEMORY_KINDS) }, forget: S() }),
      run: async (a) => {
        const doc = await getGoalsDoc();
        if (a.forget) doc.memory = doc.memory.filter((m) => !m.text.includes(a.forget));
        if (a.fact) { doc.memory.push(compact({ text: a.fact, at: ymd(), kind: MEMORY_KINDS[a.kind] && a.kind !== 'pref' ? a.kind : undefined })); doc.memory = doc.memory.slice(-40); }
        await saveGoalsDoc(doc);
        return { ok: true, count: doc.memory.length };
      },
    },
  ];
  const TOOL_BY_NAME = Object.fromEntries(TOOLS.map((t) => [t.name, t]));

  function toolDefs() {
    const defs = TOOLS.map((t) => ({ type: 'function', function: { name: t.name, description: t.description, parameters: t.parameters } }));
    if (state.mcp) {
      state.mcp.tools.forEach((t) => defs.push({ type: 'function', function: {
        name: mcpToolName(t.name), description: '[远程 MCP] ' + (t.description || t.name),
        parameters: t.inputSchema && t.inputSchema.type ? t.inputSchema : { type: 'object', properties: {} },
      } }));
    }
    return defs;
  }

  async function runTool(name, args, ctx) {
    const local = TOOL_BY_NAME[name];
    if (local) return local.run(args || {}, ctx);
    if (state.mcp) {
      const remote = state.mcp.tools.find((t) => mcpToolName(t.name) === name);
      if (remote) return state.mcp.callTool(remote.name, args);
    }
    throw new Error('没有这个工具：' + name);
  }
  function toolLabel(name, args) {
    const t = TOOL_BY_NAME[name];
    try { if (t && t.label) return t.label(args || {}); } catch (e) { /* ignore */ }
    return name.startsWith('mcp_') ? '远程工具 ' + name.slice(4) : name;
  }

  // ================================================================== daily report

  async function buildReport(day) {
    const [tasks, archived, lk, j, log, tg, doc] = await Promise.all([
      need('getTasks')(), API.getArchivedTasks ? API.getArchivedTasks().catch(() => []) : [], loadLookups(), getDay(day), getLog(day), timeByGoal([day], true), getGoalsDoc(),
    ]);
    const all = tasks.concat(archived || []);
    const L = ['# 日报 ' + day + '（' + weekday(day) + '）', ''];
    if (j.plan) {
      L.push('## 今日主线', j.plan.theme || '（未写）', '');
      const items = (j.plan.items || []).map((it) => { const t = all.find((x) => x.id === it.taskId); return { it, done: t ? !!t.isDone : false }; });
      L.push('## 计划完成 ' + items.filter((x) => x.done).length + '/' + items.length);
      items.forEach(({ it, done }) => L.push('- [' + (done ? 'x' : ' ') + '] ' + (it.time ? it.time + ' ' : '') + it.title));
      L.push('');
    }
    const doneToday = all.filter((t) => t.isDone && t.doneOn && ymd(new Date(t.doneOn)) === day && !isRitual(t));
    if (doneToday.length) { L.push('## 今天完成的任务（' + doneToday.length + '）'); doneToday.slice(0, 30).forEach((t) => L.push('- ' + t.title)); L.push(''); }
    L.push('## 时间投入 共 ' + fmtDur(tg.total));
    Object.entries(tg.byGoal).sort((x, y) => y[1] - x[1]).forEach(([k, v]) => {
      const g = doc.goals.find((x) => x.id === k);
      L.push('- ' + (g ? g.emoji + ' ' + g.title : '其他') + '：' + fmtDur(v));
    });
    L.push('');
    if (log.segs.length) {
      L.push('## 时间轴');
      log.segs.forEach((s) => L.push('- ' + hm(new Date(s.s)) + '–' + hm(new Date(s.e)) + ' ' + s.title + '（' + fmtDur(s.e - s.s) + '）'));
      L.push('');
    }
    if (log.away.length) {
      const brk = log.away.filter((a) => a.verdict === 'break' || a.verdict === 'other').reduce((n, a) => n + a.min, 0);
      L.push('## 离开检查（扣除 ' + brk + ' 分钟）');
      log.away.forEach((a) => L.push('- ' + hm(new Date(a.s)) + ' 离开 ' + a.min + ' 分：' + ({ work: '在工作', break: '休息', other: '做别的', unknown: '未回答' }[a.verdict] || a.verdict) + '（' + a.title + '）'));
      L.push('');
    }
    if (j.review) {
      const r = j.review;
      L.push('## 复盘');
      if (r.wins) L.push('- 收获：' + r.wins);
      if (r.problems) L.push('- 问题：' + r.problems);
      if (r.lessons) L.push('- 改进：' + r.lessons);
      if (r.tomorrow) L.push('- 明天第一件事：' + r.tomorrow);
      if (r.mood || r.energy) L.push('- 心情 ' + (r.mood || '-') + '/5 · 精力 ' + (r.energy || '-') + '/5');
      L.push('');
    }
    const cds = doc.goals.filter((g) => g.targetDate && daysUntil(g.targetDate) >= 0 && g.status !== 'done');
    if (cds.length) { L.push('## 倒计时'); cds.forEach((g) => L.push('- ' + g.emoji + ' ' + g.title + '：还有 ' + daysUntil(g.targetDate) + ' 天')); }
    return L.join('\n').trim() + '\n';
  }

  // 日报写进 SP：今天的「🧭 参谋」任务（没有就新建一个已完成的），这样能在 SP 里搜索、同步、归档
  async function writeReportToSp(day) {
    const report = await buildReport(day);
    await patchDay(day, (d) => { d.report = report; });
    const tasks = await need('getTasks')();
    let t = tasks.find((x) => isRitual(x) && !x.isDone && (isDueOn(x, day) || x.title.includes('复盘')));
    if (!t) t = tasks.find((x) => isRitual(x) && x.title.includes('日报 ' + day.slice(5)));
    if (t) {
      await need('updateTask')(t.id, { title: RITUAL_PREFIX + '：日报 ' + day.slice(5), notes: report, isDone: true, doneOn: Date.now() });
    } else {
      const id = await need('addTask')({ title: RITUAL_PREFIX + '：日报 ' + day.slice(5), notes: report, dueDay: day });
      await need('updateTask')(id, { isDone: true, doneOn: Date.now() });
    }
    return '已写入任务「' + RITUAL_PREFIX + '：日报 ' + day.slice(5) + '」的备注';
  }

  // ================================================================== system prompt (persona + compact context capsule)

  async function contextCapsule() {
    const today = ymd();
    const lines = ['', '【当前情况】', '现在：' + today + ' ' + weekday(today) + ' ' + hm() + '（' + Intl.DateTimeFormat().resolvedOptions().timeZone + '）。“明天/下周一”要换算成具体日期。'];
    try {
      const [doc, day] = await Promise.all([getGoalsDoc(), getDay(today)]);
      const gl = doc.goals.filter((g) => g.status !== 'done').map((g) => {
        let s = g.emoji + g.title + '[' + g.id + ', 标签#' + g.tag + ']';
        if (g.focus) s += ' 本周重点：' + g.focus;
        const next = (g.keyDates || []).find((k) => daysUntil(k.date) >= 0);
        if (next) s += ' ｜' + next.label + ' ' + next.date + (next.estimated ? '(预计)' : '') + ' 剩' + daysUntil(next.date) + '天';
        else if (g.targetDate && daysUntil(g.targetDate) >= 0) s += ' ｜目标日 ' + g.targetDate + ' 剩' + daysUntil(g.targetDate) + '天';
        return '- ' + s;
      });
      if (gl.length) lines.push('长期目标：', ...gl);
      lines.push('今日计划：' + (day.plan ? (day.plan.theme || '') + '（' + (day.plan.items || []).length + ' 项）' : '还没定') + '；复盘：' + (day.review ? '已完成' : '未做'));
      if (doc.memory.length) lines.push('案卷（关于用户）：', ...doc.memory.slice(-15).map((m) => '- ' + memoryLine(m)));
    } catch (e) { /* 上下文只是锦上添花 */ }
    if (state.mcp) lines.push('以 mcp_ 开头的是远程 MCP 服务器的工具。');
    return lines.join('\n');
  }

  // ================================================================== 诊断：先判断局面，再决定怎么回
  //
  // 用户一口气说一大段（倾诉、抱怨、半成品的想法）时，模型最容易逐条回应、被用户的叙事带着走。
  // 所以长消息先单独过一遍诊断：把用户的说法和 SP 里的实际记录、案卷里的旧话对照，
  // 找出真正的问题，再决定这一轮是追问、指出问错了问题，还是直接回答。
  // 只多一次不带工具的调用；短指令（“明天 3 点提醒我…”）不诊断，不增加等待。
  const DIAG_MIN_CHARS = 60;
  const DIAG_MOVES = { ask: '先追问', redirect: '换个问题', answer: '直接回答' };

  const DIAG_PROMPT = [
    '你是参谋的「诊断」环节。你不直接回复用户，只输出一个 JSON，参谋会据此决定怎么回。',
    '用户常常一口气说很多：抱怨、猜测、半成品的想法。逐条回应会被用户的叙事带着走。你的任务是跳出这个叙事，像一个见过很多类似案例的老练顾问那样判断局面：',
    '1. complaint：用户自己认为的问题，一句话。',
    '2. real：你判断真正值得解决的问题，一句话。可以和 complaint 不同；用户问错了问题就直说。',
    '3. conflicts：用户的说法和【事实】或【案卷】对不上的地方，每条写成“说法 ↔ 证据”。证据只能来自下面给的材料，不许编；没有就给空数组。',
    '4. assumptions：用户默认成立、但没检验过的前提，最多 3 条。',
    '5. gap：最影响判断、但现在还不知道的一件事。',
    '6. move 三选一：ask=信息不够，先问一个问题；redirect=用户问的不是关键，先把真问题指出来；answer=信息够了，直接回答真问题。缺关键信息时宁可 ask，也不要硬给方案。',
    '7. question：move=ask 时要问的那一个问题。它的答案必须能区分两种不同的判断，不要问“能多说一点吗”这种泛泛的问题。',
    '8. opening：参谋回复的第一句话。',
    '只输出 JSON，不要别的文字：{"complaint":"","real":"","conflicts":[],"assumptions":[],"gap":"","move":"ask","question":"","opening":""}',
  ].join('\n');

  // 给诊断用的“事实”：最近 7 天实际做了什么，以及案卷。用户的说法要拿它来对照
  async function factSheet() {
    const today = ymd();
    const days = Array.from({ length: 7 }, (_, i) => addDays(today, i - 6));
    const [doc, journals, logs, tgs, tasks, archived] = await Promise.all([
      getGoalsDoc(), Promise.all(days.map(getDay)), Promise.all(days.map(getLog)), Promise.all(days.map((d) => timeByGoal([d], true))),
      need('getTasks')(), API.getArchivedTasks ? API.getArchivedTasks().catch(() => []) : [],
    ]);
    const byId = {}; (tasks || []).concat(archived || []).forEach((t) => { byId[t.id] = t; });
    const goalName = (id) => { const g = doc.goals.find((x) => x.id === id); return g ? g.title.replace(/（.*）/, '') : '未归类'; };
    const lines = ['【事实：最近 7 天 SP 里的记录】'];
    days.forEach((d, i) => {
      const j = journals[i], tg = tgs[i];
      const parts = [d.slice(5) + weekday(d)];
      const spent = Object.keys(tg.byGoal).map((k) => goalName(k) + minutes(tg.byGoal[k]) + '分');
      parts.push('投入 ' + minutes(tg.total) + ' 分' + (spent.length ? '（' + spent.join('、') + '）' : ''));
      if (j.plan) {
        const items = j.plan.items || [];
        parts.push('计划 ' + items.length + ' 项、完成 ' + items.filter((it) => byId[it.taskId] && byId[it.taskId].isDone).length + ' 项');
      } else parts.push('没定计划');
      const rest = logs[i].away.filter((a) => a.verdict === 'break' || a.verdict === 'other').reduce((n, a) => n + (a.min || 0), 0);
      if (rest) parts.push('计时中离开去休息/干别的 ' + rest + ' 分');
      if (j.review && j.review.problems) parts.push('复盘说卡在：' + String(j.review.problems).slice(0, 60));
      lines.push('- ' + parts.join('；'));
    });
    const dl = [];
    doc.goals.forEach((g) => {
      if (g.status === 'done') return;
      const next = (g.keyDates || []).find((k) => daysUntil(k.date) >= 0);
      if (next) dl.push(g.title + ' ' + next.label + ' 剩 ' + daysUntil(next.date) + ' 天');
      else if (g.targetDate && daysUntil(g.targetDate) >= 0) dl.push(g.title + ' 剩 ' + daysUntil(g.targetDate) + ' 天');
    });
    if (dl.length) lines.push('期限：' + dl.join('；'));
    lines.push('【案卷：之前记下的偏好、承诺和反复出现的说法】');
    lines.push(...(doc.memory.length ? doc.memory.map((m) => '- ' + memoryLine(m)) : ['（还没有）']));
    return lines.join('\n');
  }

  function parseDiag(text) {
    const m = String(text || '').match(/\{[\s\S]*\}/);
    if (!m) return null;
    let d; try { d = JSON.parse(m[0]); } catch (e) { return null; }
    if (!d || typeof d !== 'object' || !d.real) return null;
    const list = (v) => (Array.isArray(v) ? v : v ? [v] : []).map(String).filter(Boolean).slice(0, 4);
    return compact({
      complaint: String(d.complaint || ''), real: String(d.real), conflicts: list(d.conflicts), assumptions: list(d.assumptions),
      gap: String(d.gap || ''), move: DIAG_MOVES[d.move] ? d.move : 'answer', question: String(d.question || ''), opening: String(d.opening || ''),
    });
  }

  async function diagnose(text, signal) {
    const prev = state.history.slice(0, -1);
    const users = prev.filter((m) => m.role === 'user').slice(-3).map((m) => '- ' + String(m.content).slice(0, 200));
    const lastAi = [...prev].reverse().find((m) => m.role === 'assistant' && m.content);
    const ask = [];
    if (users.length) ask.push('【用户前几轮说的话】', ...users);
    if (lastAi) ask.push('【参谋上一轮说的】', String(lastAi.content).slice(0, 300));
    ask.push('【用户这次说的话】', text);
    const system = DIAG_PROMPT + '\n\n现在：' + ymd() + ' ' + weekday(ymd()) + ' ' + hm() + '\n' + (await factSheet());
    const msg = await chatBuffered([{ role: 'system', content: system }, { role: 'user', content: ask.join('\n') }], [], signal);
    return parseDiag(msg.content);
  }

  // 主回复看到的诊断结论和回复规则
  function diagBrief(d) {
    const out = ['', '【本轮诊断（用户只看到摘要，你据此回复）】', '用户说的问题：' + (d.complaint || '—'), '真正的问题：' + d.real];
    if (d.conflicts) out.push('说法和记录的冲突：', ...d.conflicts.map((c) => '- ' + c));
    if (d.assumptions) out.push('没检验过的前提：', ...d.assumptions.map((c) => '- ' + c));
    if (d.gap) out.push('还缺的信息：' + d.gap);
    out.push('这一轮的动作：' + d.move + (d.question ? '（要问：' + d.question + '）' : ''));
    if (d.opening) out.push('建议第一句：' + d.opening);
    out.push('回复规则：不要逐条回应用户说的每一点，围绕“真正的问题”回复。',
      d.move === 'ask' ? '这一轮只问那一个问题（能给选项就用 ask_user），不给方案。' :
        d.move === 'redirect' ? '第一句就指出真正的问题，以及为什么用户问的那个不是关键；然后给一个具体的下一步。' :
          '直接回答真正的问题，结论先行。',
      '有冲突就点出来并带上证据；没有就别硬找。');
    return out.join('\n');
  }

  async function shouldDiagnose(text) {
    if (text.length < DIAG_MIN_CHARS) return false;
    try { return (await getSettings()).diagnose !== false; } catch (e) { return true; }
  }

  // ================================================================== conversation state

  // 按“用户轮次”裁剪，保证 assistant(tool_calls) 和它的 tool 结果不被拆开
  function trimHistory() {
    const idx = []; state.history.forEach((m, i) => { if (m.role === 'user') idx.push(i); });
    if (idx.length > KEEP_USER_TURNS) state.history = state.history.slice(idx[idx.length - KEEP_USER_TURNS]);
  }
  // 中断后补齐缺失的 tool 结果，否则下一次请求会被模型接口拒绝
  function repairHistory() {
    const out = [];
    for (let i = 0; i < state.history.length; i++) {
      const m = state.history[i];
      out.push(m);
      if (m.role === 'assistant' && m.tool_calls && m.tool_calls.length) {
        const have = new Set();
        let k = i + 1;
        while (k < state.history.length && state.history[k].role === 'tool') { have.add(state.history[k].tool_call_id); k++; }
        for (; i + 1 < k; i++) out.push(state.history[i + 1]);
        m.tool_calls.forEach((c) => { if (!have.has(c.id)) out.push({ role: 'tool', tool_call_id: c.id, content: '{"error":"已取消"}' }); });
      }
    }
    state.history = out;
  }
  // 省 token：较早轮次的工具结果只留开头
  function messagesForModel(system) {
    const idx = []; state.history.forEach((m, i) => { if (m.role === 'user') idx.push(i); });
    const cut = idx.length > FULL_TOOL_TURNS ? idx[idx.length - FULL_TOOL_TURNS] : 0;
    const msgs = state.history.map((m, i) => {
      const o = { role: m.role, content: m.content };
      if (m.tool_calls) o.tool_calls = m.tool_calls;
      if (m.tool_call_id) o.tool_call_id = m.tool_call_id;
      if (m.role === 'tool' && i < cut && String(m.content).length > 300) o.content = String(m.content).slice(0, 300) + '…（已省略）';
      return o;
    });
    return [{ role: 'system', content: system }].concat(msgs);
  }
  const saveHistory = () => lsWrite({ history: state.history });

  // ================================================================== chat rendering

  function md(text) {
    const lines = String(text || '').replace(/\r/g, '').split('\n');
    const out = []; let i = 0;
    const inline = (s) => h(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
      .replace(/~~([^~]+)~~/g, '<s>$1</s>');
    while (i < lines.length) {
      let line = lines[i];
      if (/^```/.test(line)) {
        const buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++; out.push('<pre>' + h(buf.join('\n')) + '</pre>'); continue;
      }
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        const row = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const head = row(line); i += 2; const body = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
        out.push('<table><tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr>' + body.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</table>');
        continue;
      }
      let m;
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { out.push('<h' + Math.min(4, m[1].length + 1) + '>' + inline(m[2]) + '</h' + Math.min(4, m[1].length + 1) + '>'); i++; continue; }
      if (/^\s*([-*_])\s*\1\s*\1\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
      if (/^>\s?/.test(line)) { const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, '')); out.push('<blockquote>' + inline(buf.join(' ')) + '</blockquote>'); continue; }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
        const ordered = /^\s*\d+[.)]/.test(line); const items = [];
        while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
          let it = lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, '');
          const task = it.match(/^\[([ xX])\]\s*(.*)$/);
          items.push(task ? '<li class="task">' + (task[1] === ' ' ? '☐ ' : '☑ ') + inline(task[2]) + '</li>' : '<li>' + inline(it) + '</li>');
        }
        out.push((ordered ? '<ol>' : '<ul>') + items.join('') + (ordered ? '</ol>' : '</ul>')); continue;
      }
      if (!line.trim()) { i++; continue; }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|>|\s*([-*+]|\d+[.)])\s+|\s*\|.*\|\s*$)/.test(lines[i])) buf.push(lines[i++]);
      if (!buf.length) { buf.push(lines[i++]); }
      out.push('<p>' + buf.map(inline).join('<br>') + '</p>');
    }
    return out.join('');
  }

  function addAiRow() {
    clearHero();
    const row = document.createElement('div');
    row.className = 'row ai';
    row.innerHTML = '<div class="avatar sm">参</div><div class="ai-body"><div class="stepsbox"></div><div class="md"></div><div class="extra"></div></div>';
    els.log.appendChild(row); scrollDown(true);
    const body = row.querySelector('.md');
    const stepsBox = row.querySelector('.stepsbox');
    const extra = row.querySelector('.extra');
    let text = '', steps = null, typing = null, t0 = Date.now(), timer = null;
    const api = {
      row,
      typing(on) {
        if (on && !typing) {
          typing = document.createElement('div'); typing.className = 'typing';
          typing.innerHTML = '<i></i><i></i><i></i><span></span>';
          body.after(typing); t0 = Date.now();
          timer = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); typing.lastChild.textContent = s >= 3 ? s + 's' : ''; }, 1000);
        } else if (!on && typing) { clearInterval(timer); typing.remove(); typing = null; }
      },
      setText(t) { text = t; body.innerHTML = md(t); scrollDown(); },
      appendText(t) { text = text ? text + '\n\n' + t : t; body.innerHTML = md(text); scrollDown(); },
      text: () => text,
      step(label) {
        if (!steps) {
          steps = document.createElement('details'); steps.className = 'steps';
          steps.innerHTML = '<summary><span class="spin"></span><span class="sum"></span></summary><ul></ul>';
          stepsBox.appendChild(steps);
        }
        const li = document.createElement('li');
        li.innerHTML = '<span>⋯</span><div></div>';
        li.lastChild.textContent = label;
        steps.querySelector('ul').appendChild(li);
        const n = steps.querySelectorAll('li').length;
        steps.querySelector('.sum').textContent = '正在' + label;
        scrollDown();
        return {
          done(ok, detail) {
            li.firstChild.textContent = ok ? '✓' : '✗';
            if (!ok) { li.className = 'fail'; steps.open = true; }
            if (detail) { const sm = document.createElement('small'); sm.textContent = ' ' + String(detail).slice(0, 160); li.lastChild.appendChild(sm); }
            const fails = steps.querySelectorAll('li.fail').length;
            steps.querySelector('.sum').textContent = '已执行 ' + n + ' 个操作' + (fails ? '（' + fails + ' 个失败）' : '');
          },
        };
      },
      diag(d) {
        const box = document.createElement('details'); box.className = 'diag';
        let inner = '';
        if (d.complaint) inner += '<div><b>你说的</b>' + h(d.complaint) + '</div>';
        (d.conflicts || []).forEach((c) => { inner += '<div><b>对不上</b>' + h(c) + '</div>'; });
        (d.assumptions || []).forEach((c) => { inner += '<div><b>前提</b>' + h(c) + '</div>'; });
        if (d.gap) inner += '<div><b>还缺</b>' + h(d.gap) + '</div>';
        box.innerHTML = '<summary><i>' + h(DIAG_MOVES[d.move]) + '</i><span></span></summary>' + inner;
        box.querySelector('summary span').textContent = '真正的问题：' + d.real;
        stepsBox.appendChild(box); scrollDown();
      },
      finishSteps() { if (steps) { const sp = steps.querySelector('.spin'); if (sp) sp.remove(); } },
      choices(question, options) {
        if (question && !text.includes(question)) api.appendText(question);
        const box = document.createElement('div'); box.className = 'choices';
        options.forEach((o) => {
          const b = document.createElement('button'); b.textContent = o;
          b.onclick = () => { box.querySelectorAll('button').forEach((x) => { x.disabled = true; }); send(o); };
          box.appendChild(b);
        });
        extra.appendChild(box); scrollDown(true);
      },
      confirm(message, okLabel) {
        return new Promise((resolve) => {
          const c = document.createElement('div'); c.className = 'confirm';
          c.innerHTML = '<div></div><div class="btns"><button class="btn danger"></button><button class="btn">取消</button></div>';
          c.firstChild.textContent = message;
          const [ok, cancel] = c.querySelectorAll('button');
          ok.textContent = okLabel || '确定';
          const done = (v) => { ok.disabled = cancel.disabled = true; c.style.opacity = '.6'; resolve(v); };
          ok.onclick = () => done(true); cancel.onclick = () => done(false);
          if (state.abort) state.abort.signal.addEventListener('abort', () => done(false), { once: true });
          extra.appendChild(c); scrollDown(true);
        });
      },
      actions(userText) {
        const a = document.createElement('div'); a.className = 'acts';
        a.innerHTML = '<button data-a="copy">' + ICON.copy + '复制</button>' + (userText ? '<button data-a="retry">' + ICON.retry + '重试</button>' : '');
        a.onclick = (e) => {
          const b = e.target.closest('button'); if (!b) return;
          if (b.dataset.a === 'copy') copyText(text, b);
          if (b.dataset.a === 'retry' && !state.busy) send(userText);
        };
        row.querySelector('.ai-body').appendChild(a);
      },
      error(msg) {
        const e = document.createElement('div'); e.className = 'err-card'; e.textContent = msg;
        extra.appendChild(e); scrollDown(true);
      },
    };
    return api;
  }

  function copyText(text, btn) {
    const done = () => { if (btn) { const old = btn.innerHTML; btn.innerHTML = '✓ 已复制'; setTimeout(() => { btn.innerHTML = old; }, 1200); } };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); return; }
    } catch (e) { /* fall through */ }
    fallback();
    function fallback() {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
      ta.remove();
    }
  }

  // ================================================================== agent loop

  async function send(textArg) {
    if (state.busy) { if (state.abort) state.abort.abort(); return; }
    const text = (typeof textArg === 'string' ? textArg : els.input.value || '').trim();
    if (!text) return;
    if (!cfg.llmBase || !cfg.model) { switchTab('settings'); toast('先在这里填好大模型 API'); return; }
    if (typeof textArg !== 'string') { els.input.value = ''; autoGrow(); }
    switchTab('chat');
    addUserRow(text);
    repairHistory();
    state.history.push({ role: 'user', content: text });
    trimHistory(); saveHistory();
    const ai = addAiRow();
    state.abort = new AbortController();
    setBusy(true); setStatus('warn', '思考中…');
    try {
      await ensureMcp();
      let diag = null;
      if (await shouldDiagnose(text)) {
        setStatus('warn', '诊断中…');
        const st = ai.step('对照你的记录，判断真正的问题');
        try { diag = await diagnose(text, state.abort.signal); } catch (e) { if (e.aborted) throw e; }
        st.done(!!diag, diag ? '' : '诊断没成功，直接回答');
        if (diag) { state.history[state.history.length - 1].diag = diag; saveHistory(); ai.diag(diag); }
        setStatus('warn', '思考中…');
      }
      await loop(ai, state.abort.signal, diag);
      setStatus('ok', modelLabel() + ' · ' + hm());
    } catch (e) {
      if (e.aborted) { if (!ai.text()) ai.setText('_已停止_'); setStatus('', '已停止'); }
      else { ai.error(errMsg(e)); setStatus('err', '出错了 · ' + hm()); }
    } finally {
      ai.typing(false); ai.finishSteps(); ai.actions(text);
      repairHistory(); saveHistory();
      state.abort = null; setBusy(false);
    }
  }

  async function loop(ai, signal, diag) {
    const system = PERSONA + '\n' + (await contextCapsule()) + (diag ? '\n' + diagBrief(diag) : '');
    for (let round = 0; round < MAX_ROUNDS; round++) {
      ai.typing(true);
      const before = ai.text();
      const msg = await chat(messagesForModel(system), toolDefs(), signal, (partial) => { ai.typing(false); ai.setText(before ? before + '\n\n' + partial : partial); });
      ai.typing(false);
      const entry = { role: 'assistant', content: msg.content || null };
      if (msg.tool_calls && msg.tool_calls.length) {
        entry.tool_calls = msg.tool_calls.map((c, i) => ({ id: c.id || 'call_' + Date.now() + '_' + i, type: 'function', function: { name: c.function.name, arguments: c.function.arguments || '{}' } }));
      } else if (entry.content === null) entry.content = '';
      state.history.push(entry);
      if (entry.content) ai.setText(before ? before + '\n\n' + entry.content : entry.content);
      if (!entry.tool_calls) return;
      setStatus('warn', '执行中…');
      let ends = false;
      for (const call of entry.tool_calls) {
        if (signal.aborted) throw abortError();
        ends = (await execToolCall(call, ai)) || ends;
      }
      saveHistory();
      if (ends) return; // ask_user：等用户点选项
      setStatus('warn', '思考中…');
    }
    ai.appendText('_操作步骤太多，先停在这里。说“继续”我接着做。_');
  }

  async function execToolCall(call, ai) {
    const name = call.function.name;
    let args;
    try { args = JSON.parse(call.function.arguments || '{}') || {}; } catch (e) {
      const bad = '参数不是合法 JSON';
      ai.step(name).done(false, bad);
      state.history.push({ role: 'tool', tool_call_id: call.id, content: JSON.stringify({ error: bad }) });
      return false;
    }
    const st = ai.step(toolLabel(name, args));
    const ctx = { confirm: (m, l) => ai.confirm(m, l), showChoices: (q, o) => ai.choices(q, o) };
    try {
      const out = await runTool(name, args, ctx);
      let txt = typeof out === 'string' ? out : JSON.stringify(out === undefined ? { ok: true } : out);
      if (txt.length > TOOL_RESULT_MAX) txt = txt.slice(0, TOOL_RESULT_MAX) + '…（已截断）';
      state.history.push({ role: 'tool', tool_call_id: call.id, content: txt });
      st.done(true);
      return !!(TOOL_BY_NAME[name] && TOOL_BY_NAME[name].endsTurn);
    } catch (e) {
      const m = errMsg(e);
      state.history.push({ role: 'tool', tool_call_id: call.id, content: JSON.stringify({ error: m }) });
      st.done(false, m);
      return false;
    }
  }
