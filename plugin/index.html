      const all = tasks.concat(archived || []);
      const isToday = day === ymd();
      let html = '<div class="daynav"><button class="btn ghost" data-act="prev">‹</button><b>' + (isToday ? '今天 · ' : '') + day.slice(5).replace('-', '月') + '日 ' + weekday(day) + '</b><button class="btn ghost" data-act="next"' + (isToday ? ' disabled' : '') + '>›</button></div>';

      const cds = [];
      doc.goals.forEach((g) => (g.keyDates || []).forEach((k) => { const n = daysUntil(k.date); if (n >= 0 && n <= 120) cds.push({ n, label: g.emoji + ' ' + g.title.replace(/（.*）/, '') + ' ' + k.label + (k.estimated ? '(预计)' : '') }); }));
      cds.sort((a, b) => a.n - b.n);
      if (cds.length) html += '<div class="countdowns">' + cds.slice(0, 6).map((c) => '<div class="cd"><b>' + c.n + '</b> 天<span>' + h(c.label) + '</span></div>').join('') + '</div>';

      // 计划
      html += '<div class="card"><h3>🎯 今日计划<span class="sp"></span>' + (j.plan ? '<small>' + new Date(j.plan.at).toTimeString().slice(0, 5) + ' 制定</small>' : '') + '</h3>';
      if (j.plan) {
        if (j.plan.theme) html += '<div style="margin-bottom:6px"><b>主线：</b>' + h(j.plan.theme) + '</div>';
        (j.plan.items || []).forEach((it) => {
          const t = all.find((x) => x.id === it.taskId); const done = t && t.isDone;
          const g = doc.goals.find((x) => x.id === it.goal);
          html += '<div class="plan-item"><span class="check' + (done ? ' on' : '') + '">' + (done ? '✓' : '') + '</span><div class="t"><span class="' + (done ? 'done-t' : '') + '">' + h(it.title) + '</span><small>' +
            [it.time, it.minutes ? it.minutes + ' 分钟' : '', g ? g.emoji + ' ' + g.title : '', t ? '已投入 ' + fmtDur((t.timeSpentOnDay || {})[day] || 0) : ''].filter(Boolean).map(h).join(' · ') + '</small></div></div>';
        });
        if (j.plan.note) html += '<div class="muted" style="margin-top:6px">💡 ' + h(j.plan.note) + '</div>';
      } else {
        html += '<div class="muted">' + (isToday ? '还没定计划。' : '这天没有计划。') + '</div>';
      }
      if (isToday) html += '<div class="btn-row"><button class="btn' + (j.plan ? '' : ' primary') + '" data-ask="帮我定今天的计划">' + (j.plan ? '调整计划' : '和参谋定计划') + '</button></div>';
      html += '</div>';

      // 时间
      html += '<div class="card"><h3>⏱️ 时间投入<span class="sp"></span><small>共 ' + fmtDur(tg.total) + '</small></h3>';
      const entries = Object.entries(tg.byGoal).sort((a, b) => b[1] - a[1]);
      if (entries.length) {
        html += '<div class="bars">' + entries.map(([k, v]) => '<span style="width:' + (100 * v / tg.total).toFixed(2) + '%;background:' + colorOfGoal(doc.goals, k) + '"></span>').join('') + '</div><div class="legend">' +
          entries.map(([k, v]) => { const g = doc.goals.find((x) => x.id === k); return '<span><i style="background:' + colorOfGoal(doc.goals, k) + '"></i>' + h(g ? g.emoji + ' ' + g.title : '其他（没打目标标签）') + '</span><span>' + fmtDur(v) + '</span>'; }).join('') + '</div>';
      } else html += '<div class="muted">这天还没有计时记录。</div>';

      // 时间轴
      if (log.segs.length || log.away.length) {
        const starts = log.segs.map((s) => s.s).concat(log.away.map((a) => a.s));
        const ends = log.segs.map((s) => s.e).concat(log.away.map((a) => a.e));
        const dayStart = parseDayDate(day).getTime();
        let from = Math.min(dayStart + 6 * 3600000, Math.floor((Math.min(...starts) - dayStart) / 3600000) * 3600000 + dayStart);
        let to = Math.max(from + 6 * 3600000, Math.ceil((Math.max(...ends) - dayStart) / 3600000) * 3600000 + dayStart);
        const span = to - from;
        const pos = (t) => (100 * (t - from) / span).toFixed(2);
        const taskGoal = (id) => { const t = all.find((x) => x.id === id); if (!t) return null; const par = t.parentId && all.find((x) => x.id === t.parentId); const g = goalOfTask(t, doc.goals, lk) || (par && goalOfTask(par, doc.goals, lk)); return g ? g.id : '_other'; };
        html += '<div class="timeline">' +
          log.segs.map((s) => '<div class="seg" title="' + h(s.title) + '" style="left:' + pos(s.s) + '%;width:' + (100 * (s.e - s.s) / span).toFixed(2) + '%;background:' + colorOfGoal(doc.goals, taskGoal(s.taskId)) + '"></div>').join('') +
          log.away.filter((a) => a.verdict !== 'work').map((a) => '<div class="seg away" style="left:' + pos(a.s) + '%;width:' + (100 * (a.e - a.s) / span).toFixed(2) + '%"></div>').join('') +
          '</div><div class="ticks">' + [0, 1, 2, 3, 4].map((i) => '<span>' + hm(new Date(from + span * i / 4)) + '</span>').join('') + '</div>';
        html += '<details class="seglist"><summary class="muted">时间轴明细（' + log.segs.length + ' 段）</summary>' +
          log.segs.slice().reverse().map((s) => '<div><time>' + hm(new Date(s.s)) + '–' + hm(new Date(s.e)) + '</time><span>' + h(s.title) + ' · ' + fmtDur(s.e - s.s) + (s.live ? ' · 进行中' : '') + '</span></div>').join('') + '</details>';
      } else if (isNativeHost()) {
        html += '<div class="muted" style="margin-top:8px">时间轴会在你用 SP 计时后自动出现。</div>';
      }
      if (log.away.length) {
        const V = { work: '在工作', break: '休息', other: '做别的', unknown: '未回答' };
        const cut = log.away.filter((a) => a.verdict === 'break' || a.verdict === 'other').reduce((n, a) => n + a.min, 0);
        html += '<div class="seglist" style="margin-top:10px"><div class="muted">📵 离开检查 ' + log.away.length + ' 次，扣除 ' + cut + ' 分钟</div>' +
          log.away.map((a) => '<div><time>' + hm(new Date(a.s)) + '</time><span>离开 ' + a.min + ' 分 · ' + V[a.verdict] + ' · ' + h(a.title) + '</span></div>').join('') + '</div>';
      }
      html += '</div>';

      // 复盘 & 日报
      html += '<div class="card"><h3>🌙 复盘</h3>';
      if (j.review) {
        const r = j.review;
        html += '<dl class="kv">' + [['收获', r.wins], ['问题', r.problems], ['改进', r.lessons], ['明天', r.tomorrow], ['状态', (r.mood || r.energy) ? '心情 ' + (r.mood || '-') + '/5 · 精力 ' + (r.energy || '-') + '/5' : '']]
          .filter((x) => x[1]).map((x) => '<dt>' + x[0] + '</dt><dd>' + h(x[1]) + '</dd>').join('') + '</dl>';
      } else html += '<div class="muted">' + (isToday ? '晚上花 2 分钟复盘，参谋会生成日报。' : '这天没有复盘。') + '</div>';
      html += '<div class="btn-row">' + (isToday && !j.review ? '<button class="btn primary" data-ask="开始今天的晚间复盘">开始复盘</button>' : '') +
        '<button class="btn" data-act="copy-report">复制日报</button><button class="btn" data-act="write-report">写入 SP</button></div></div>';

      box.innerHTML = html;
      box.querySelector('[data-act="prev"]').onclick = () => { state.todayDay = addDays(day, -1); renderToday(); };
      const nx = box.querySelector('[data-act="next"]'); if (nx) nx.onclick = () => { state.todayDay = addDays(day, 1) > ymd() ? ymd() : addDays(day, 1); renderToday(); };
      box.querySelectorAll('[data-ask]').forEach((b) => { b.onclick = () => send(b.dataset.ask); });
      box.querySelector('[data-act="copy-report"]').onclick = async (e) => copyText(await buildReport(day), e.target);
      box.querySelector('[data-act="write-report"]').onclick = async (e) => {
        e.target.disabled = true;
        try { toast(await writeReportToSp(day)); } catch (err) { toast('写入失败：' + errMsg(err)); }
        e.target.disabled = false;
      };
    } catch (e) {
      box.innerHTML = '<div class="err-card">加载失败：' + h(errMsg(e)) + '</div>';
    }
  }

  // ================================================================== 目标

  async function renderGoals() {
    const box = $('goals');
    try {
      const doc = await getGoalsDoc();
      const days = Array.from({ length: 7 }, (_, i) => addDays(ymd(), -i));
      let tg = { byGoal: {} };
      try { tg = await timeByGoal(days, true); } catch (e) { /* 时间统计失败也要能看目标 */ }
      let html = '<div class="muted" style="margin:4px 2px 12px">任务打上目标的标签（如 <b>#国考</b>），时间就会算进这个目标。点卡片可编辑。</div>';
      doc.goals.forEach((g, gi) => {
        const next = (g.keyDates || []).find((k) => daysUntil(k.date) >= 0);
        const dl = g.targetDate ? daysUntil(g.targetDate) : null;
        const open = state.openGoal === g.id;
        html += '<div class="card goal' + (open ? ' open' : '') + '" data-goal="' + h(g.id) + '"><div class="goal-head"><div class="goal-emoji" style="box-shadow: inset 0 -3px 0 ' + GOAL_COLORS[gi % GOAL_COLORS.length] + '">' + h(g.emoji || '🎯') + '</div><div class="t"><b>' + h(g.title) + (g.status === 'paused' ? ' <small class="muted">（暂停）</small>' : g.status === 'done' ? ' <small class="muted">（已完成）</small>' : '') + '</b><span>' +
          h(g.focus ? '本周：' + g.focus : next ? next.label + ' ' + next.date + (next.estimated ? '（预计）' : '') : '近 7 天投入 ' + fmtDur(tg.byGoal[g.id] || 0)) + '</span></div>' +
          (dl !== null && dl >= 0 ? '<div class="goal-days"><b>' + dl + '</b><span>天</span></div>' : '<div class="goal-days"><b style="font-size:15px">' + fmtDur(tg.byGoal[g.id] || 0) + '</b><span>近 7 天</span></div>') + '</div>';
        html += '<div class="goal-body">' +
          '<div class="pills" style="margin-bottom:10px"><span class="pill on">#' + h(g.tag || '') + '</span><span class="pill">近 7 天 ' + fmtDur(tg.byGoal[g.id] || 0) + '</span>' +
          (g.keyDates || []).map((k) => '<span class="pill' + (daysUntil(k.date) >= 0 ? ' on' : '') + '">' + h(k.label + ' ' + k.date.slice(5) + (k.estimated ? ' 预计' : '') + (daysUntil(k.date) >= 0 ? ' · ' + daysUntil(k.date) + '天' : ' · 已过')) + '</span>').join('') + '</div>' +
          ((g.milestones || []).length ? '<div style="margin-bottom:10px">' + g.milestones.map((m, mi) => '<label class="ms"><input type="checkbox" data-ms="' + mi + '"' + (m.done ? ' checked' : '') + '> <span class="' + (m.done ? 'done-t' : '') + '">' + h(m.text) + '</span></label>').join('') + '</div>' : '') +
          '<div class="grid2"><div class="field"><label>图标</label><input data-f="emoji" value="' + h(g.emoji || '') + '"></div><div class="field"><label>关联标签</label><input data-f="tag" value="' + h(g.tag || '') + '"></div></div>' +
          '<div class="field"><label>标题</label><input data-f="title" value="' + h(g.title) + '"></div>' +
          '<div class="field"><label>为什么要做（动机越具体越好）</label><textarea data-f="why">' + h(g.why || '') + '</textarea></div>' +
          '<div class="field"><label>本周重点</label><input data-f="focus" value="' + h(g.focus || '') + '"></div>' +
          '<div class="grid2"><div class="field"><label>目标日期</label><input type="date" data-f="targetDate" value="' + h(g.targetDate || '') + '"></div><div class="field"><label>状态</label><select data-f="status"><option value="active">进行中</option><option value="paused"' + (g.status === 'paused' ? ' selected' : '') + '>暂停</option><option value="done"' + (g.status === 'done' ? ' selected' : '') + '>已完成</option></select></div></div>' +
          '<div class="field"><label>关键日期（每行一个：名称 YYYY-MM-DD，预计的在末尾加 ?）</label><textarea data-f="keyDates">' + h((g.keyDates || []).map((k) => k.label + ' ' + k.date + (k.estimated ? ' ?' : '')).join('\n')) + '</textarea></div>' +
          '<div class="field"><label>里程碑（每行一个，已完成的以 x 开头）</label><textarea data-f="milestones">' + h((g.milestones || []).map((m) => (m.done ? 'x ' : '') + m.text).join('\n')) + '</textarea></div>' +
          '<div class="btn-row"><button class="btn primary" data-act="save">保存</button><button class="btn" data-act="chat">和参谋聊这个目标</button><span style="flex:1"></span><button class="btn danger ghost" data-act="del">删除</button></div>' +
          '</div></div>';
      });
      html += '<div class="btn-row" style="justify-content:center"><button class="btn" data-act="add">＋ 新增目标</button><button class="btn" data-act="memory">参谋记住的事（' + doc.memory.length + '）</button></div>';
      box.innerHTML = html;

      box.querySelectorAll('.goal').forEach((card) => {
        const g = doc.goals.find((x) => x.id === card.dataset.goal);
        card.querySelector('.goal-head').onclick = () => { state.openGoal = state.openGoal === g.id ? null : g.id; card.classList.toggle('open'); };
        card.querySelectorAll('[data-ms]').forEach((cb) => {
          cb.onchange = async () => { const m = g.milestones[+cb.dataset.ms]; m.done = cb.checked; m.doneOn = cb.checked ? ymd() : undefined; await saveGoalsDoc(doc); renderGoals(); };
        });
        card.querySelector('[data-act="save"]').onclick = async () => {
          const v = (f) => card.querySelector('[data-f="' + f + '"]').value.trim();
          Object.assign(g, { emoji: v('emoji') || '🎯', tag: v('tag').replace(/^#/, ''), title: v('title') || g.title, why: v('why'), focus: v('focus'), targetDate: v('targetDate'), status: v('status') });
          g.keyDates = v('keyDates').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {

          g.milestones = v('milestones').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => { const d = /^x\s+/i.test(l); return { text: l.replace(/^x\s+/i, ''), done: d }; });
          await saveGoalsDoc(doc); toast('已保存「' + g.title + '」'); renderGoals();
        };
        card.querySelector('[data-act="chat"]').onclick = () => send('我们聊聊「' + g.title + '」这个目标：现在进展如何、这周的重点该是什么？缺的信息问我。');
        card.querySelector('[data-act="del"]').onclick = async () => {
          if (!window.confirm('删除目标「' + g.title + '」？（不会删除任务）')) return;
          doc.goals = doc.goals.filter((x) => x !== g); await saveGoalsDoc(doc); renderGoals();
        };
      });
      box.querySelector('[data-act="add"]').onclick = async () => {
        const g = { id: uid(), emoji: '🎯', title: '新目标', tag: '新目标', why: '', focus: '', targetDate: '', keyDates: [], milestones: [] };
        doc.goals.push(g); state.openGoal = g.id; await saveGoalsDoc(doc); renderGoals();
      };
      box.querySelector('[data-act="memory"]').onclick = () => {
        const list = doc.memory.map((m, i) => (i + 1) + '. ' + memoryLine(m)).join('\n') || '还没有。聊天时参谋会把你的习惯、偏好、说过要做的事记在这里。';
        window.alert(list);
      };
    } catch (e) {
      box.innerHTML = '<div class="err-card">加载失败：' + h(errMsg(e)) + '</div>';
    }
  }

        '<div class="switch"><div class="t">流式输出<small>服务商允许浏览器直连时逐字显示；不允许会自动改用普通模式</small></div><select id="fStream"><option value="on"' + (cfg.stream !== false ? ' selected' : '') + '>开</option><option value="off"' + (cfg.stream === false ? ' selected' : '') + '>关</option></select></div>' +
        '<div class="btn-row"><button class="btn" data-act="save-adv">保存</button><button class="btn" data-act="export">导出目标与日志</button><button class="btn ghost danger" data-act="clear">清空对话</button></div>' +
        '<div class="muted" style="margin-top:10px">AI 参谋 v' + VERSION + ' · ' + (native ? '手机端' : '桌面/网页端') + '</div></div>';

    const q = (sel) => box.querySelector(sel);
    box.querySelectorAll('[data-preset]').forEach((b) => {
      b.onclick = () => {
        const p = presetById(b.dataset.preset);
        box.querySelectorAll('[data-preset]').forEach((x) => x.classList.toggle('on', x === b));
        if (p.base) q('#fBase').value = p.base;
        q('#fModel').value = p.model || '';
        box.dataset.preset = p.id;
      };
    });
    const readLlm = () => ({ preset: box.dataset.preset || cfg.preset, llmBase: q('#fBase').value.trim().replace(/\/+$/, '').replace(/\/chat\/completions$/, ''), apiKey: q('#fKey').value.trim(), model: q('#fModel').value.trim() });
    const status = (id, ok, text) => { q(id).innerHTML = '<div class="status-line"><i class="dot ' + (ok === null ? 'warn' : ok ? 'ok' : 'err') + '"></i><span>' + h(text) + '</span></div>'; };

    q('[data-act="save-llm"]').onclick = async () => {
      cfg = Object.assign(cfg, readLlm()); persistCfg(); showCfgStatus();
      status('#llmStatus', null, '测试中…');
      try {
        const m = await chat([{ role: 'user', content: '只回复 OK' }], [], null, () => {});
        let origin = ''; try { origin = new URL(cfg.llmBase).origin; } catch (e) { /* ignore */ }
        const via = lsGet('streamOk', {})[origin] === true && cfg.stream !== false ? '浏览器直连 · 流式' : TRANSPORT_NAME[state.goodTransport[origin]] || '';
        status('#llmStatus', true, '可以用了（' + via + '），模型回复：' + String(m.content || '').slice(0, 30));
        setStatus('ok', modelLabel());
      } catch (e) { status('#llmStatus', false, errMsg(e)); setStatus('err', '模型连不上'); }
    };
    q('[data-act="models"]').onclick = async () => {
      const saved = cfg; cfg = Object.assign({}, cfg, readLlm());
      status('#llmStatus', null, '获取中…');
      try {
        const ids = await fetchModels();
        q('#modelList').innerHTML = ids.map((id) => '<option value="' + h(id) + '">').join('');
        status('#llmStatus', true, ids.length + ' 个模型：' + ids.slice(0, 30).join('、') + (ids.length > 30 ? '…' : '') + '\n点“模型”输入框可以从列表选。');
      } catch (e) { status('#llmStatus', false, '获取失败（有的服务商不支持，可以手动填）：' + errMsg(e)); }
      cfg = saved;
    };
    q('[data-act="save-mcp"]').onclick = async () => {
      cfg.mcpUrl = q('#fMcpUrl').value.trim(); cfg.mcpToken = q('#fMcpToken').value.trim(); persistCfg();
      state.mcp = null; state.mcpFailedAt = 0;
      if (!cfg.mcpUrl) { q('#mcpStatus').innerHTML = ''; return; }
      status('#mcpStatus', null, '连接中…');
      const c = new McpClient(cfg.mcpUrl, cfg.mcpToken);
      try {
        const tools = await c.connect(); c.ready = true; state.mcp = c;
        status('#mcpStatus', true, '已连接 ' + c.serverName + ' · ' + tools.length + ' 个工具：' + tools.map((t) => t.name).slice(0, 12).join('、') + (c.sid ? '' : '\n（服务器没有返回会话 id，按无状态模式使用）'));
      } catch (e) { status('#mcpStatus', false, errMsg(e)); }
    };
    const clr = q('[data-act="clear-mcp"]'); if (clr) clr.onclick = () => { cfg.mcpUrl = ''; cfg.mcpToken = ''; state.mcp = null; persistCfg(); renderSettings(); };
    q('[data-act="save-rhythm"]').onclick = async () => {
      const ns = Object.assign({}, s);
      box.querySelectorAll('[data-s]').forEach((el) => {
        const k = el.dataset.s; let v = el.value;
        if (k === 'awayMinutes') v = Math.max(1, Math.min(240, Number(v) || 10));
        else if (k === 'awayCheck' || k === 'timeline' || k === 'ritualTask') v = v === 'auto' ? null : v === 'on';
        else if (k === 'openPrompt' || k === 'diagnose') v = v === 'on';
        ns[k] = v;
      });
      await saveKey('settings', ns); toast('节奏设置已保存');
    };
    q('[data-act="save-adv"]').onclick = () => {
      cfg.transport = q('#fTransport').value; cfg.stream = q('#fStream').value === 'on';
      state.goodTransport = {}; persistCfg(); toast('已保存');
    };
    q('[data-act="export"]').onclick = async (e) => {
      const months = Array.from({ length: 3 }, (_, i) => { const d = new Date(); d.setMonth(d.getMonth() - i); return ymd(d).slice(0, 7); });
      const data = { goals: await getGoalsDoc(), settings: await getSettings() };
      for (const m of months) { data['journal-' + m] = await loadKey('journal-' + m, null); data['log-' + m] = await loadKey('log-' + m, null); }
      copyText(JSON.stringify(data, null, 1), e.target);
    };
    q('[data-act="clear"]').onclick = () => { if (state.busy) return; state.history = []; saveHistory(); rebuildLog(); toast('对话已清空（目标和日志不受影响）'); };
  }

  function persistCfg() { lsWrite({ cfg }); }

  // ================================================================== boot

  function autoGrow() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, Math.round(window.innerHeight * 0.34)) + 'px';
    updateSendEnabled();
  }

  function consumeIntent() {
    const it = lsGet('intent', null);
    if (!it || Date.now() - it.at > 10 * 60000) return;
    lsSet('intent', null);
    if (!cfg.llmBase || !cfg.model) return;
    send(it.kind === 'review' ? '开始今天的晚间复盘' : '帮我定今天的计划');
  }

  function init() {
    if (API && API.cfg && API.cfg.theme) document.documentElement.setAttribute('data-theme', API.cfg.theme);
    $('btnNew').innerHTML = ICON.edit;
    const stored = lsRead();
    if (stored.cfg) cfg = Object.assign(cfg, stored.cfg);
    if (!cfg.llmBase && cfg.preset !== 'custom') { const p0 = presetById(cfg.preset); cfg.llmBase = p0.base; cfg.model = cfg.model || p0.model; }
    state.history = Array.isArray(stored.history) ? stored.history : [];
    repairHistory();
    showCfgStatus();
    setBusy(false);
    rebuildLog();

    document.querySelectorAll('#tabs button').forEach((b) => { b.onclick = () => switchTab(b.dataset.tab); });
    $('btnNew').onclick = () => { if (state.busy) return; state.history = []; saveHistory(); switchTab('chat'); rebuildLog(); };
    els.send.onclick = () => send();
    els.input.addEventListener('input', autoGrow);
    els.input.addEventListener('keydown', (e) => {
      // 手机输入法的回车用来换行；桌面上 Enter 发送、Shift+Enter 换行
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isNativeHost()) { e.preventDefault(); send(); }
    });
    if (API && typeof API.registerHook === 'function') {
      try { API.registerHook('currentTaskChange', () => { if (state.tab === 'today') setTimeout(renderToday, 300); }); } catch (e) { /* ignore */ }
    }
    if (!API) { const a = addAiRow(); a.error('未检测到 PluginAPI：这个页面需要作为 Super Productivity 插件运行。'); }
    if (!cfg.apiKey && cfg.preset !== 'custom') switchTab('settings');
    else consumeIntent();
  }

  window.__spAiAssistant = { McpClient, state, tools: TOOL_BY_NAME, http, md, buildReport };
  init();
})();
</script>
</body>
</html>
