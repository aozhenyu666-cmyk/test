# 脉络：每次改动 mailuo/ 时跑端到端验收，并打出可直接安装的 Android 调试包（APK）。
# APK 在 Actions 运行页面底部的 Artifacts 里下载：mailuo-debug-apk。
name: 脉络 Android APK

on:
  push:
    paths: ['mailuo/**', '.github/workflows/mailuo-android.yml']
  pull_request:
    paths: ['mailuo/**', '.github/workflows/mailuo-android.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: mailuo

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Unit tests (pure logic)
        run: node --test dev/unit/*.test.mjs
      - name: End-to-end acceptance (mock model)
        run: node dev/e2e.mjs

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mailuo/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest 自带 Android SDK（ANDROID_HOME），缺的平台由 Gradle 自动下载
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mailuo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mailuo-debug-apk
          path: mailuo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # 测试和打包都通过后，发布到固定的下载地址（覆盖上一版）：
  # https://github.com/aozhenyu666-cmyk/test/releases/download/mailuo-latest/mailuo.apk
  release:
    # 只有集成分支发布；Codex 的任务分支 / PR 只跑测试和打包，不覆盖下载链接
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'ccr-153bfa69-lm85up')
    needs: [e2e, apk]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mailuo-debug-apk
          path: apk
      - name: Publish to release mailuo-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/app-debug.apk mailuo.apk
          VERSION=$(node -p "require('./mailuo/package.json').version")
          gh release delete mailuo-latest --cleanup-tag --yes || true
          gh release create mailuo-latest mailuo.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "脉络 v$VERSION 最新调试版" \
            --notes "由提交 ${GITHUB_SHA::7} 自动构建，已通过端到端验收测试。直接安装 mailuo.apk，可覆盖旧版本，数据保留（知识库在手机「文档/脉络」文件夹）。"
