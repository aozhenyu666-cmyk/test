name: shell-widgets

# 只跑壳层三个组件的 widget 测试：底部导航、磁贴、通知。
#
# 为什么不跑全仓：全仓的 `flutter test` 里有大批 golden 用例（app/test/**/goldens/*.png），
# 它们要预生成的截图和固定的字体/排版环境，在 CI 上重新跑等于把 noise 当失败信号。
# 这个 workflow 只回答一个问题——这一轮改的三块壳层还对不对。
#
# 名单里的三个文件都确认过没有一处 matchesGoldenFile（改名单之前先 grep 一遍）：
#   test/shell/bottom_nav_test.dart    底部导航（局 / 墙 / 对话）
#   test/tiles/tile_grid_test.dart     磁贴（网格布局 + 卡片行为）
#   test/notify/chat_alerts_test.dart  通知
#
# 磁贴和通知的 Android 侧（BoutsTileStatus / 常驻通知）是 JUnit，不在这一份里，
# 它跟着 build-dafeiyu-apk.yml 的 :app:testArm64DebugUnitTest 跑。

on:
  push:
    branches: [deepseek/round8]
    paths:
      - ".github/workflows/shell-widgets.yml"
      - "app/lib/ui/shell/**"
      - "app/lib/ui/common/**"
      - "app/lib/notify/**"
      - "app/lib/l10n/**"
      - "app/test/shell/**"
      - "app/test/tiles/**"
      - "app/test/notify/**"
      - "app/pubspec.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  widgets:
    runs-on: ubuntu-latest
    defaults:
      run:
        # test/support/test_fonts.dart loads assets/fonts/... by relative path.
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      # 跟另外三个 workflow 同一步，别省：gen-l10n 读的是合并后的 app_*.arb，字符串只写在
      # lib/l10n/parts/<area>_{zh,en}.arb 里，不合并的话 parts 里新增的键在 L10n 里根本不存在。
      # 漏这一步的代价：run 43356129766 编译失败，wall_page.dart 的 wallTitle 等键全都找不到
      # （build-dafeiyu-apk.yml 也踩过同一个坑，见那里的 run 43061525642）。
      - name: merge l10n parts
        run: python3 tool/l10n_merge.py

      - name: Widget tests (bottom nav / tiles / notify)
        run: |
          flutter test \
            test/shell/bottom_nav_test.dart \
            test/tiles/tile_grid_test.dart \
            test/notify/chat_alerts_test.dart
