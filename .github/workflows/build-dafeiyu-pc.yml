name: Build 大肥鱼 PC Windows 客户端

on:
  push:
    branches: [feat/dafeiyu-v3-on-1016]
    paths:
      - ".github/workflows/build-dafeiyu-pc.yml"
      - "desktop/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-pc:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Pub get, analyze & run desktop tests
        working-directory: desktop
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Release executable
        working-directory: desktop
        run: flutter build windows --release

      - name: Package Windows ZIP & SHA256
        shell: pwsh
        run: |
          $outDir = "desktop/build/windows/x64/runner/Release"
          if (-not (Test-Path "$outDir/dsh_go_fish_pc.exe")) {
            throw "Missing built main executable in $outDir"
          }
          if (-not (Test-Path "$outDir/dsh_fish_watchdog.exe")) {
            throw "Missing built watchdog executable in $outDir"
          }
          Compress-Archive -Path "$outDir/*" -DestinationPath "DSH-Go-Fish-PC-Windows-x64.zip" -Force
          $hash = (Get-FileHash "DSH-Go-Fish-PC-Windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DSH-Go-Fish-PC-Windows-x64.zip" | Out-File -Encoding utf8 "PC-SHA256.txt"
          cat PC-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-fish-pc-windows-x64
          path: |
            DSH-Go-Fish-PC-Windows-x64.zip
            PC-SHA256.txt
          retention-days: 14

      - name: Publish prerelease for Windows PC client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "fish-pc-build-${{ github.run_number }}"
          @(
            "## DSH Go 大肥鱼 · Windows 独立严防哨兵 #${{ github.run_number }}"
            ""
            '- 完全独立运行于 Windows，不依赖手机连接；包含主程序 `dsh_go_fish_pc.exe` 与原生 C++ 互保守护进程 `dsh_fish_watchdog.exe`。'
            '- 明确严格的本地规则与持久化账本：改严立即生效、改松进入 12 小时冷却队列、关闭隐藏至托盘、开机自启、高阻力随机码+理由+60s冷静期退出、铁锁专注倒计时禁止提前撤防。'
            '- OpenAI 兼容 AI 接口（DeepSeek / Gemini / OpenAI / Ollama / 自定义）：自动识别灰区站点学习/摸鱼、限时学习通行证审批与真实账本复盘参谋。'
          ) | Set-Content -Path PC_NOTES.md -Encoding utf8
          gh release create $tag `
            DSH-Go-Fish-PC-Windows-x64.zip PC-SHA256.txt `
            --target "${{ github.sha }}" `
            --title "DSH Go 大肥鱼 · PC 客户端 #${{ github.run_number }}" `
            --notes-file PC_NOTES.md `
            --prerelease
