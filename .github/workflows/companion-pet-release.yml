name: Companion Pet official release

# 正式版发布。写入的 tag 是 tongzhuo-stable：
# 旧分支里的旧工作流只认识 tongzhuo-latest，永远写不到这里，所以不会再被旧版本覆盖。
# 建议在仓库 Settings → Environments 给 official-release 加“需要审批”，发布前由负责人点确认。
# 迁移/回滚见 companion-pet/handoff/release-isolation/STATE.md。
#
# 为什么同时有 workflow_dispatch 和 push:tags —— 这是本文件最容易踩的坑：
# GitHub 只允许触发「已在该仓库注册过」的工作流，而只有 workflow_dispatch 的工作流
# 在它从未出现在默认分支时**根本注册不上**，手动运行会直接返回
#   HTTP 404: workflow companion-pet-release.yml not found on the default branch
# 本仓库默认分支是 SP 插件分支（claude/super-productivity-mcp-mobile-xe4499），
# 本文件不在其上，于是「只能手动触发」= 永远触发不了，正式发布一次都没成功过。
# 加一个 tag 触发后，推送 tag 即可让 GitHub 认识并运行本工作流，
# 不再依赖改仓库默认分支这种管理员操作。
# 用法：git tag tongzhuo-release-39 && git push origin tongzhuo-release-39

on:
  workflow_dispatch:
  push:
    tags:
      - 'tongzhuo-release-*'

permissions:
  contents: read

concurrency:
  group: companion-pet-official-release
  cancel-in-progress: false

jobs:
  release:
    # 允许发布的来源（白名单）。必须同时满足两个条件才可能发出正式版：
    #   1. 该 ref 上确实存在本文件（旧分支只有旧工作流，认识不到 tongzhuo-stable）；
    #   2. 该 ref 在这个白名单里。
    # 分支白名单：宠物主线（当前 vc39）+ 旧的发布分支，保持原设计不变。
    # tag 白名单：tongzhuo-release-* 只允许从主线打出来——启动时用 API 校验
    #   tag 指向的提交必须是 mainline 的祖先，防止有人从旧分支打 tag 把低版本发出去。
    # 换主线时只改 mainline 这一处。
    if: >-
      github.ref == 'refs/heads/ccr-2899d69f-xlzjh6' ||
      github.ref == 'refs/heads/claude/r21-strict-takeover' ||
      github.ref == 'refs/heads/deepseek/r21-proactive' ||
      startsWith(github.ref, 'refs/tags/tongzhuo-release-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: official-release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: companion-pet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tag 触发时必须确认这个 tag 打在允许的主线上。
      # 否则任何人从旧分支（比如还停在 0.5.5 的 moling-*）推一个
      # tongzhuo-release-* tag，就能绕过分支白名单把低版本发成正式版。
      - name: Verify tag comes from an allowed branch
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Tag $GITHUB_REF points at $GITHUB_SHA"
          # 现在的主线是 claude/r21-strict-takeover（用户 2026-10-28 确认加入）。
          ALLOWED=("claude/r21-strict-takeover" "deepseek/r21-proactive" "ccr-2899d69f-xlzjh6")
          OK=no
          for br in "${ALLOWED[@]}"; do
            # 该分支当前 head 是否包含本 tag 指向的提交
            if gh api "repos/${GH_REPO}/compare/${GITHUB_SHA}...${br}" \
                 --jq '.status' 2>/dev/null | grep -qx 'ahead\|identical'; then
              echo "OK: commit is on ${br}"
              OK=yes
              break
            fi
          done
          if [ "$OK" != yes ]; then
            echo "Refusing: tag $GITHUB_REF_NAME is not on any allowed branch (${ALLOWED[*]})." >&2
            echo "A tag on an old branch must not be able to publish an official release." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Unit tests, lint and build APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Publish to tongzhuo-stable (versionCode must increase)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=tongzhuo-stable
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)

          # 先确认产物真的在，否则后面删掉旧 release 就会把下载链接弄 404。
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -s "$APK" ]; then
            echo "Refusing: $APK is missing or empty" >&2
            exit 1
          fi

          # versionCode 只能升不能降。这里必须 fail-closed：
          # 以前写成 `gh release view ... || true`，一旦查询因为网络抖动失败，
          # OLD 变空、判断被跳过，低版本就会被当成正式版发出去——
          # 正是当初 0.5.5 覆盖 0.5.8、手机上装不上的那个事故。
          if gh release view "$TAG" >/dev/null 2>&1; then
            BODY=$(gh release view "$TAG" --json body --jq .body)
            OLD=$(printf '%s' "$BODY" | grep -oP 'versionCode \K[0-9]+' | head -1 || true)
            if [ -z "${OLD}" ]; then
              echo "Refusing: release $TAG exists but no versionCode could be parsed from it." >&2
              echo "Fix the notes or remove the release manually; not publishing blindly." >&2
              exit 1
            fi
            if [ "${CODE}" -le "${OLD}" ]; then
              echo "Refusing: versionCode ${CODE} is not greater than the published ${OLD}" >&2
              exit 1
            fi
            echo "versionCode ${CODE} > published ${OLD}: ok"
          else
            echo "No $TAG release yet; publishing first official version."
          fi

          cp "$APK" tongzhuo.apk
          SHA256=$(sha256sum tongzhuo.apk | cut -d' ' -f1)
          NOTES=$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            "同桌 ${VERSION}（versionCode ${CODE}），正式版。" \
            "分支：${GITHUB_REF_NAME}" \
            "提交：${GITHUB_SHA}" \
            "SHA-256：${SHA256}" \
            "固定签名，可以直接覆盖安装，不用卸载。")
          # tag 一旦建好就固定在旧提交上，所以删掉重建（版本检查已在上面通过）。
          # 删除和创建之间会有几秒 404 窗口，但绝不删掉正在使用的版本后才失败：
          # 上面的产物与版本检查都已在删除之前完成。
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" tongzhuo.apk --target "$GITHUB_SHA" --title "同桌 ${VERSION}（正式版）" --notes "$NOTES"
          echo "Official: https://github.com/${GH_REPO}/releases/download/${TAG}/tongzhuo.apk"
