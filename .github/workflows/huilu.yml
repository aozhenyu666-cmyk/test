name: huilu

on:
  push:
    paths: ["huilu/**", ".github/workflows/huilu.yml"]
  pull_request:
    paths: ["huilu/**", ".github/workflows/huilu.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: huilu

jobs:
  # 标准构建：Android Gradle 插件 + D8
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: core 单元测试 + 构建 APK
        run: ./gradlew --no-daemon --console=plain :core:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: huilu-debug-apk
          path: huilu/app/build/outputs/apk/debug/*.apk

  # 备用构建（不依赖 Android Gradle 插件）+ Robolectric 集成测试，与仓库里 dist/ 下的 APK 同一条路径
  fallback:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 aapt / dx / apksigner
        run: sudo apt-get update -q && sudo apt-get install -y -q aapt dalvik-exchange zipalign apksigner zip
      - name: 构建 APK 并运行 Robolectric 测试
        run: ./tools/build-apk.sh --test
      - uses: actions/upload-artifact@v4
        with:
          name: huilu-fallback-apk
          path: huilu/dist/*.apk
