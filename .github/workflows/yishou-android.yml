name: yishou-android

# 「一手」Android 应用：每次改动 yishou/ 下的文件就跑单元测试并打包调试版 APK。
# 打好的 APK 在本次运行页面底部的 Artifacts 里下载（yishou-debug-apk）。
on:
  push:
    paths:
      - "yishou/**"
      - ".github/workflows/yishou-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yishou
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yishou-debug-apk
          path: yishou/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yishou-test-reports
          path: yishou/app/build/reports/tests/
