name: 云端模拟器冒烟（x86_64）

# 为什么要有这一条：本机是 Windows，x86_64 runtime 只能由 x86_64 Linux 宿主构建
# （runtime/build-runtime.sh 的设计前提），而 arm64 包在 x86_64 模拟器上跑不起来
# （libproot.so 被 ARM 翻译层直接 exec 时找不到 libtalloc.so）。GitHub 的 runner 正好是
# x86_64 Linux + KVM，模拟器是原生 x86_64，不经过翻译层。
#
# 这条流水线只做一件事：证明「x64 包在真 Android 上能把引擎起来、能说话」。
# 它出的是 debug 探针包（-t lib/dev/runtime_probe_main.dart），不是给用户装的包。
on:
  push:
    branches: [deepseek/round4]
    paths:
      - ".github/workflows/android-x64-smoke.yml"
      - "app/lib/dev/**"
      - "app/android/**"
      - "runtime/**"
      - "tooling/companion-e2e/fake-llm.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PROOT_VERSION: 5.1.107.102
      # 假模型跑在 runner 上；模拟器用 10.0.2.2 回指宿主机。
      LLM_PORT: "18900"
    steps:
      - uses: actions/checkout@v4

      # KVM 是硬前提：没有它模拟器退化成纯软件模拟，光开机就要半小时。
      # runner 上 /dev/kvm 是 root:kvm 660，当前用户还不在 kvm 组里，直接读会被拒。
      - name: KVM 可用性
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gpgv zstd xz-utils unzip file
          ls -l /dev/kvm
          sudo usermod -aG kvm "$USER"
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          sg kvm -c 'test -r /dev/kvm' || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle.kts
            app/android/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # 插件单测便宜，先跑：runtime 构建要十几分钟，别等它跑完才发现插件坏了。
      - name: 插件单测（快速失败）
        run: cd app/assets/engine/plugins/dsh-go-companion && node --test test/*.test.mjs

      - name: 构建 x86_64 runtime
        env:
          NPM_REGISTRY: https://registry.npmjs.org
        run: |
          bash runtime/build-runtime.sh x86_64
          test -f runtime/out/x86_64/assets/runtime/manifest.json
          test -f runtime/out/x86_64/assets/runtime/rootfs-x86_64.tar.xz
          ls -la runtime/out/x86_64/assets/runtime/

      # 把模型指到宿主机的假模型上。这条只能走 launch.argv（引擎进程的真实环境变量），
      # 不能写 .env：DEEPSEEK_BASE_URL 属于 bootstrap-only 名单，写进 .env 会让 DSH 拒绝启动。
      # 只改这次冒烟用的 manifest，不进任何发布包。
      - name: 把引擎指向 mock 模型（只改冒烟包的 manifest）
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("runtime/out/x86_64/assets/runtime/manifest.json")
          m = json.loads(p.read_text())
          argv = m["launch"]["argv"]
          assert "{GUEST_ENV}" in argv, "manifest 没有 {GUEST_ENV}：模板变了，先看这里"
          i = argv.index("{GUEST_ENV}")
          inject = [
              "DEEPSEEK_BASE_URL=http://10.0.2.2:18900",
              "DEEPSEEK_API_KEY=sk-mock-not-a-real-key",
          ]
          for j, value in enumerate(inject):
              argv.insert(i + 1 + j, value)
          p.write_text(json.dumps(m, indent=2))
          print("argv tail:", argv[-6:])
          PY

      - name: 起假模型（0.0.0.0，模拟器经 10.0.2.2 访问）
        run: |
          mkdir -p tooling/companion-e2e/.work
          nohup env HOST=0.0.0.0 PORT=18900 node tooling/companion-e2e/fake-llm.mjs \
            "$PWD/tooling/companion-e2e/.work/llm-smoke.log" \
            > shadow-llm.out 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:18900/models" && break
            sleep 1
          done
          curl -s "http://127.0.0.1:18900/models" | head -c 200; echo

      - name: 构建 x64 探针包
        run: |
          cd app
          flutter pub get
          python3 tool/l10n_merge.py
          flutter build apk --debug --flavor x64 --target-platform android-x64 \
            -t lib/dev/runtime_probe_main.dart --build-number "${{ github.run_number }}0"
          ls -la build/app/outputs/flutter-apk/

      - name: 开模拟器、装包、跑探针、断言
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # 冷启动一次就够；快照会在同一 job 内复用不到，直接关掉更省事。
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -o pipefail
            ADB="$ANDROID_HOME/platform-tools/adb"
            "$ADB" root || true
            sleep 2
            "$ADB" install -r app/build/app/outputs/flutter-apk/app-x64-debug.apk

            # 探针见到这个文件才会跑一次真实回合（假模型回话），跑完自己删掉。
            # adb root 在这类 google_apis 镜像上可用；拿不到就退回 run-as（debug 包可调试）。
            printf 'sk-mock-not-a-real-key' > probe-key
            "$ADB" push probe-key /data/local/tmp/probe-key
            "$ADB" shell "mkdir -p /data/user/0/io.github.ccch1mneyyy.dsh_app/files"
            if ! "$ADB" shell "cp /data/local/tmp/probe-key /data/user/0/io.github.ccch1mneyyy.dsh_app/files/probe-key"; then
              "$ADB" shell "run-as io.github.ccch1mneyyy.dsh_app sh -c 'mkdir -p files && cp /data/local/tmp/probe-key files/probe-key'"
            fi

            "$ADB" logcat -c || true
            "$ADB" shell monkey -p io.github.ccch1mneyyy.dsh_app -c android.intent.category.LAUNCHER 1

            # 首启要解压 rootfs（几百 MB），给它足够时间。
            ok=0
            for i in $(seq 1 180); do
              if "$ADB" logcat -d | grep -q 'PROBE OK'; then ok=1; break; fi
              if "$ADB" logcat -d | grep -q 'PROBE FAILED'; then ok=2; break; fi
              sleep 5
            done
            "$ADB" logcat -d > full-logcat.txt || true
            grep -E '\[probe\]|PROBE|COMPANION' full-logcat.txt | tail -80 || true
            "$ADB" shell screencap -p /sdcard/smoke.png || true
            "$ADB" pull /sdcard/smoke.png smoke.png || true
            "$ADB" shell "run-as io.github.ccch1mneyyy.dsh_app cat files/loop/proactive/ledger.json" > proactive-ledger.json 2>/dev/null || true

            if [ "$ok" != 1 ]; then
              echo "::error::探针没有走到 PROBE OK（ok=$ok），看下面上传的 logcat"
              exit 1
            fi
            # 计划层与提交层必须一致：这次修复的核心不变量。
            grep -q 'COMPANION OK' full-logcat.txt || { echo "::error::插件路由检查没通过"; exit 1; }

      - name: 上传现场（总是上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x64-emulator-smoke
          path: |
            full-logcat.txt
            smoke.png
            proactive-ledger.json
            shadow-llm.out
            tooling/companion-e2e/.work/llm-smoke.log
            tooling/companion-e2e/.work/prompts.jsonl
          retention-days: 14
          if-no-files-found: warn
