name: Companion Pet Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'companion-pet/**'
      - '.github/workflows/companion-pet-android.yml'
  pull_request:
    paths:
      - 'companion-pet/**'
      - '.github/workflows/companion-pet-android.yml'

permissions:
  contents: read

concurrency:
  group: companion-pet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 只有“发布最新 APK”这一步需要写权限（创建 Release）；拉取请求的构建不发布。
    permissions:
      contents: write
    defaults:
      run:
        working-directory: companion-pet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Unit tests, lint and build APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Print lint report on failure
        if: failure()
        run: |
          grep -A3 ': Error:' app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-pet-reports-${{ github.sha }}
          path: |
            companion-pet/app/build/reports/tests/testDebugUnitTest
            companion-pet/app/build/test-results/testDebugUnitTest
            companion-pet/app/build/reports/lint-results-debug.html
            companion-pet/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: companion-pet-debug-${{ github.sha }}
          path: companion-pet/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # 固定直链（用户已同意公开）：每次推送构建成功后，把 APK 放到滚动更新的 Release “tongzhuo-latest”。
      # 链接永远是 https://github.com/<仓库>/releases/download/tongzhuo-latest/tongzhuo.apk，
      # 无需登录、无需解压，手机浏览器直接下载安装。
      - name: Publish APK to the tongzhuo-latest release
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk tongzhuo.apk
          SHA256=$(sha256sum tongzhuo.apk | cut -d' ' -f1)
          TAG=tongzhuo-latest
          NOTES=$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            "同桌 ${VERSION}（versionCode ${CODE}），最新一次构建成功的调试版。" \
            "分支：${GITHUB_REF_NAME}" \
            "提交：${GITHUB_SHA}" \
            "SHA-256：${SHA256}" \
            "固定签名，可以直接覆盖安装，不用卸载。真机未必验证过，见仓库 companion-pet/handoff。")
          for attempt in 1 2 3; do
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
            if gh release create "$TAG" tongzhuo.apk --target "$GITHUB_SHA" --prerelease \
                --title "同桌 ${VERSION}（最新构建）" --notes "$NOTES"; then
              echo "Published https://github.com/${GH_REPO}/releases/download/${TAG}/tongzhuo.apk"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Release publish failed" >&2
          exit 1
