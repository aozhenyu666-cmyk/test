name: Companion Pet Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'companion-pet/**'
      - '.github/workflows/companion-pet-android.yml'
  pull_request:
    paths:
      - 'companion-pet/**'
      - '.github/workflows/companion-pet-android.yml'

permissions:
  contents: read

concurrency:
  group: companion-pet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: companion-pet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Unit tests, lint and build APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-pet-reports-${{ github.sha }}
          path: |
            companion-pet/app/build/reports/tests/testDebugUnitTest
            companion-pet/app/build/test-results/testDebugUnitTest
            companion-pet/app/build/reports/lint-results-debug.html
            companion-pet/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: companion-pet-debug-${{ github.sha }}
          path: companion-pet/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
