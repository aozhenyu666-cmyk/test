name: Companion Pet Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'companion-pet/**'
      - '.github/workflows/companion-pet-android.yml'
  pull_request:
    paths:
      - 'companion-pet/**'
      - '.github/workflows/companion-pet-android.yml'

permissions:
  contents: read

concurrency:
  group: companion-pet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 只有“发布最新 APK”这一步需要写权限（创建 Release）；拉取请求的构建不发布。
    permissions:
      contents: write
    defaults:
      run:
        working-directory: companion-pet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Unit tests, lint and build APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Print lint report on failure
        if: failure()
        run: |
          grep -A3 ': Error:' app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-pet-reports-${{ github.sha }}
          path: |
            companion-pet/app/build/reports/tests/testDebugUnitTest
            companion-pet/app/build/test-results/testDebugUnitTest
            companion-pet/app/build/reports/lint-results-debug.html
            companion-pet/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: companion-pet-debug-${{ github.sha }}
          path: companion-pet/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # 发布隔离（见 companion-pet/handoff/release-isolation/STATE.md）：
      # - 这个构建工作流【永远不写】正式链接（tongzhuo-latest / tongzhuo-stable）。
      # - 每个分支推送只发到自己的预览链接 tongzhuo-preview-<分支名>，互不覆盖；拉取请求不发布。
      # - 正式版只由手动触发的 companion-pet-release.yml 在主线发布到 tongzhuo-stable，且 versionCode 只能升不能降。
      - name: Publish per-branch preview APK
        if: success() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          TAG="tongzhuo-preview-${SLUG}"
          case "$TAG" in tongzhuo-latest|tongzhuo-stable) echo "refusing to write official tag" >&2; exit 1;; esac
          cp app/build/outputs/apk/debug/app-debug.apk tongzhuo.apk
          SHA256=$(sha256sum tongzhuo.apk | cut -d' ' -f1)
          NOTES=$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            "同桌 ${VERSION}（versionCode ${CODE}），分支预览构建，未经真机验收，不是正式版。" \
            "分支：${GITHUB_REF_NAME}" \
            "提交：${GITHUB_SHA}" \
            "SHA-256：${SHA256}" \
            "固定签名，可以覆盖安装；versionCode 比手机上的低时系统会拒绝安装（不要为此卸载）。")
          for attempt in 1 2 3; do
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
            if gh release create "$TAG" tongzhuo.apk --target "$GITHUB_SHA" --prerelease \
                --title "同桌 ${VERSION}（预览·${GITHUB_REF_NAME}）" --notes "$NOTES"; then
              echo "Preview: https://github.com/${GH_REPO}/releases/download/${TAG}/tongzhuo.apk"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
