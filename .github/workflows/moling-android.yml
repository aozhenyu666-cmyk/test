name: moling-android

# 「墨灵」Android 应用：改动 moling/ 下的文件就跑单元测试、打包调试版 APK，
# 发布到固定下载地址（手机浏览器直接打开即可）：
# https://github.com/aozhenyu666-cmyk/test/releases/download/moling-latest/moling.apk
# 注意：这个 workflow 只碰 moling/，不碰总控的任何 workflow 和产物。
on:
  push:
    paths:
      - "moling/**"
      - ".github/workflows/moling-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moling
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试（core 的 29 个）和调试版 APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moling-debug-apk
          path: moling/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: moling-test-reports
          path: moling/app/build/reports/tests/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: moling-debug-apk
          path: apk
      - name: Publish to release moling-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/app-debug.apk moling.apk 2>/dev/null || cp apk/debug/app-debug.apk moling.apk
          gh release delete moling-latest --cleanup-tag --yes || true
          gh release create moling-latest moling.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "墨灵 最新调试版" \
            --notes "由提交 ${GITHUB_SHA::7} 自动构建，已通过单元测试。直接安装 moling.apk，可覆盖旧版本，数据保留。"
