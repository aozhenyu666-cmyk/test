name: zongkong-android

# 「总控」Android 应用：改动 zongkong/ 下的文件就跑单元测试、打包调试版 APK，
# 再在模拟器上冒烟测试一遍（严管时打开拦截名单里的应用会不会被弹回），截图放在 Artifacts 里。
on:
  push:
    paths:
      - "zongkong/**"
      - "yishou/app/src/main/java/com/yishou/app/link/**"
      - ".github/workflows/zongkong-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zongkong
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, debug APK and end-to-end test APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug :app:assembleDebugAndroidTest

      # 外接大脑要连同机 DSH（http://127.0.0.1）：确认网络策略真的打进了交付的 APK，
      # 而且只放行本机、没有全局打开明文
      - name: Network security config is in the shipped APK (localhost only)
        run: |
          ./gradlew --no-daemon :app:processReleaseMainManifest
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk | grep networkSecurityConfig
          REL=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | grep merged_manifest | head -1)
          test -n "$REL"
          grep 'networkSecurityConfig' "$REL"
          ALL=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml)
          test -n "$ALL"
          if grep -q 'usesCleartextTraffic="true"' $ALL; then echo "不允许全局打开明文"; exit 1; fi
          grep -q 'base-config cleartextTrafficPermitted="false"' app/src/main/res/xml/network_security_config.xml
          test "$(grep -c '<domain ' app/src/main/res/xml/network_security_config.xml)" = 2

      # 一手也打一份，模拟器上装上它测两个 App 的连接
      - name: 一手 debug APK (for the link test)
        working-directory: yishou
        run: ./gradlew --no-daemon assembleMainlineDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zongkong-debug-apk
          path: |
            zongkong/app/build/outputs/apk/debug/*.apk
            zongkong/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

      # 哨兵：独立的小应用（总控崩了、被强行停止都碰不到它）
      - name: Upload 哨兵 APK
        uses: actions/upload-artifact@v4
        with:
          name: zongkong-sentinel-apk
          path: zongkong/sentinel/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload 一手 APK
        uses: actions/upload-artifact@v4
        with:
          name: yishou-apk-for-link-test
          # 一手 0.25 起有主线 / 岔路两个变体：连接测试只装主线（包名 com.yishou.app）
          path: yishou/app/build/outputs/apk/mainline/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zongkong-test-reports
          path: |
            zongkong/app/build/reports/tests/
            zongkong/sentinel/build/reports/tests/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zongkong-debug-apk
          path: zongkong/apk

      - uses: actions/download-artifact@v4
        with:
          name: yishou-apk-for-link-test
          path: zongkong/apk/yishou

      - uses: actions/download-artifact@v4
        with:
          name: zongkong-sentinel-apk
          path: zongkong/apk/sentinel

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash zongkong/scripts/smoke.sh zongkong/apk zongkong/shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zongkong-smoke
          path: zongkong/shots/
          if-no-files-found: warn

  # 固定下载地址（手机浏览器直接打开即可下载，始终是最新一次通过测试的构建）：
  # https://github.com/aozhenyu666-cmyk/test/releases/download/zongkong-latest/zongkong.apk
  # https://github.com/aozhenyu666-cmyk/test/releases/download/zongkong-latest/zongkong-sentinel.apk
  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zongkong-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: zongkong-sentinel-apk
          path: sentinel
      - uses: actions/download-artifact@v4
        with:
          name: zongkong-smoke
          path: shots
      - name: Publish to release zongkong-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/debug/app-debug.apk zongkong.apk
          cp sentinel/*.apk zongkong-sentinel.apk
          (cd shots && zip -q -r ../screenshots.zip .)
          gh release delete zongkong-latest --cleanup-tag --yes || true
          gh release create zongkong-latest zongkong.apk zongkong-sentinel.apk screenshots.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "总控 最新调试版" \
            --notes "由提交 ${GITHUB_SHA::7} 自动构建，已通过单元测试、模拟器上的端到端闭环测试和拦截测试。直接安装 zongkong.apk，可覆盖旧版本，数据保留。zongkong-sentinel.apk 是独立的哨兵（总控掉线时替它拦），也要装、也要在无障碍里打开。screenshots.zip 是模拟器上的自动测试截图。"

  # 开发分支的安装包：只要编译和单元测试过了就发到固定地址 zongkong-dev（预发布），方便直接下载覆盖安装。
  # 不碰 zongkong-latest；冒烟结果写在说明里（哨兵四项是已知失败）。签名和包名与正式版相同，可以覆盖安装。
  dev-apk:
    needs: [build, smoke]
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/claude/master-app-accessibility-debug-c7y3bi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zongkong-debug-apk
          path: apk
      - name: Publish to release zongkong-dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/debug/app-debug.apk zongkong-dev.apk
          gh release delete zongkong-dev --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create zongkong-dev zongkong-dev.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "总控 开发版（${GITHUB_REF_NAME}）" \
            --notes "由提交 ${GITHUB_SHA::7} 构建：编译和单元测试已通过；模拟器冒烟结果：${{ needs.smoke.result }}（哨兵四项是已知失败，详情见运行页 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}）。包名、签名与正式版相同，直接覆盖安装，数据保留。"
