name: Android APK

on:
  push:
    paths:
      - "behavior-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "behavior-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: behavior-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置），缺的平台和构建工具由 AGP 自动下载。
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: behavior-dept-debug-apk
          path: behavior-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: behavior-app/app/build/reports/tests/
          if-no-files-found: ignore
