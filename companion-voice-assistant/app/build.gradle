plugins { id 'com.android.application' }

android {
    namespace 'cn.companion.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.companion.assistant'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'cn.companion.assistant.SmokeInstrumentation'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
