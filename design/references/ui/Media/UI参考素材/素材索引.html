const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const el=id=>document.getElementById(id);let filtered=[],selected=0;
for(const name of [...new Set(data.map(x=>x.app))]){const o=document.createElement('option');o.value=name;o.textContent=name;el('app').append(o)}
el('stats').textContent=`${new Set(data.map(x=>x.app)).size} 个作品 · ${data.filter(x=>x.type==='image').length} 张图片 · ${data.filter(x=>x.type==='gif').length} 个 GIF · ${data.filter(x=>x.type==='video').length} 段视频`;
function render(){const q=el('search').value.toLowerCase();filtered=data.filter(x=>(!el('app').value||x.app===el('app').value)&&(!el('type').value||x.type===el('type').value)&&(!q||(x.app+x.style+x.note+x.kind).toLowerCase().includes(q)));el('shown').textContent=filtered.length+' 个文件';el('grid').innerHTML=filtered.map((x,i)=>`<article class="card"><div class="media" data-i="${i}">${x.type==='video'?`<video controls preload="metadata" src="${x.path}"></video>`:`<img loading="lazy" src="${x.path}" alt="${esc(x.file)}">`}</div><div class="text"><div class="label">${esc(x.kind)} · ${esc(x.style)}</div><h2>${esc(x.app)} · ${String(x.index).padStart(2,'0')}</h2><p>${esc(x.note)}</p><p>${x.width?x.width+' × '+x.height:'MP4 视频'} · ${(x.bytes/1024/1024).toFixed(2)} MB</p><a href="${x.path}" target="_blank">打开原文件</a> · <a href="${esc(x.source)}" target="_blank" rel="noopener">来源</a></div></article>`).join('');document.querySelectorAll('.media').forEach(d=>{d.onclick=()=>{if(filtered[+d.dataset.i].type!=='video')show(+d.dataset.i)}})}
function show(i){selected=(i+filtered.length)%filtered.length;const x=filtered[selected];el('modalmedia').innerHTML=x.type==='video'?`<video controls src="${x.path}"></video>`:`<img src="${x.path}" alt="${esc(x.file)}">`;el('caption').textContent=x.file;if(!el('modal').open)el('modal').showModal()}
['app','type','search'].forEach(id=>el(id).addEventListener(id==='search'?'input':'change',render));el('prev').onclick=()=>show(selected-1);el('next').onclick=()=>show(selected+1);el('close').onclick=()=>el('modal').close();document.addEventListener('keydown',e=>{if(el('modal').open){if(e.key==='ArrowRight')show(selected+1);if(e.key==='ArrowLeft')show(selected-1)}});render();</script></html>
