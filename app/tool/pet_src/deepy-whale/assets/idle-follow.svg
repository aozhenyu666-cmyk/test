  <defs>
    <style>
      .breathe { transform-origin: 26px 48px; animation: breathe 2.4s ease-in-out infinite; }
      .blink { transform-origin: 20.5px 39px; animation: blink 4.8s ease-in-out infinite; }
      .pose-rest { animation: pose-rest 7.2s step-end infinite; }
      .pose-tail1 { visibility: hidden; animation: pose-tail1 7.2s step-end infinite; }
      .pose-tail2 { visibility: hidden; animation: pose-tail2 7.2s step-end infinite; }
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }
      #shadow-js { transform-origin: 26px 48px; }
      @keyframes breathe {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(0.97, 1.035); }
      }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      @keyframes pose-rest { 0% { visibility: visible; } 70% { visibility: hidden; } 92% { visibility: visible; } }
      @keyframes pose-tail1 { 0% { visibility: hidden; } 70% { visibility: visible; } 74% { visibility: hidden; } 86% { visibility: visible; } 92% { visibility: hidden; } }
      @keyframes pose-tail2 { 0% { visibility: hidden; } 74% { visibility: visible; } 86% { visibility: hidden; } }
