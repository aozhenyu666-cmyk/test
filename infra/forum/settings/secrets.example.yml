# 敏感设置模板。复制成 secrets.yml 后填写，secrets.yml 已在 .gitignore 里，不会进仓库。
#   cp secrets.example.yml secrets.yml
#
# 留空的登录方式不会被启用（脚本会跳过对应的 enable_* 开关并提示）。
# 填好后执行 scripts/apply.sh；以后改了任意一项，再执行一次即可。

# ── GitHub（Discourse 内置）──────────────────────────────────────────
# 回调地址：https://<论坛域名>/auth/github/callback（dsh-go：https://forum.dshtui.com/auth/github/callback）
github_client_id: ""        # <<FILL: GitHub OAuth App 的 Client ID>>
github_client_secret: ""    # <<FILL: GitHub OAuth App 的 Client Secret（40 位十六进制）>>

# ── LINUX DO Connect（OIDC）─────────────────────────────────────────
# 回调地址：https://<论坛域名>/auth/oidc/callback（dsh-go：https://forum.dshtui.com/auth/oidc/callback）
openid_connect_client_id: ""      # <<FILL: LINUX DO Connect 的 Client ID>>
openid_connect_client_secret: ""  # <<FILL: LINUX DO Connect 的 Client Secret>>

# ── Gitee（oauth2-basic）────────────────────────────────────────────
# 回调地址：https://<论坛域名>/auth/oauth2_basic/callback（dsh-go：https://forum.dshtui.com/auth/oauth2_basic/callback）
oauth2_client_id: ""        # <<FILL: Gitee 第三方应用的 Client ID>>
oauth2_client_secret: ""    # <<FILL: Gitee 第三方应用的 Client Secret>>

# ── 可选：备份放到 S3 兼容对象存储 ──────────────────────────────────
# 同时把 site_settings.yml 里的 backup_location 改成 s3
s3_access_key_id: ""
s3_secret_access_key: ""
s3_region: ""               # 如 ap-southeast-1
s3_backup_bucket: ""        # 只能小写字母、数字、- 和 /
s3_endpoint: ""             # AWS 留空；Cloudflare R2 / 阿里云 OSS 等填 https:// 开头的端点
