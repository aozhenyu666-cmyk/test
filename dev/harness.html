<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>SP plugin harness</title>
<style>html,body{margin:0;height:100%;background:#111}iframe{border:0;width:100%;height:100%}</style>
</head>
<body>
<iframe id="f" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
<script>
// Fake Super Productivity host. Mirrors what SP does for plugins:
//  - plugin.js runs in the host window via new Function('plugin', 'PluginAPI', code)
//  - index.html is loaded via iframe srcdoc with the same sandbox flags, with window.PluginAPI injected at the top of <head>
// ?native=1 simulates the Android app: Capacitor present and window.fetch replaced by a CORS-free "native" fetch.
// ?theme=light switches the plugin theme.
const params = new URLSearchParams(location.search);
const NATIVE = params.get('native') === '1';
window.__log = { native: 0, proxy: 0, actions: [], dialogs: [], snacks: [], views: 0 };
window.__dialogAnswer = null; // label to "click" in the next host dialog (null = dismiss)
const hostFetch = window.fetch.bind(window);

async function nodeFetch(url, init) {
  const r = await window.__nodeFetch(url, { method: init?.method || 'GET', headers: init?.headers || {}, body: init?.body });
  return new Response(r.status === 204 ? null : r.text, { status: r.status, headers: r.headers });
}
if (NATIVE) {
  window.Capacitor = { isNativePlatform: () => true };
  window.fetch = (url, init) => { window.__log.native++; return nodeFetch(url, init); };
}

const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = ymd(new Date());
let seq = 100;
const base = (o) => ({ isDone: false, tagIds: [], subTaskIds: [], timeSpentOnDay: {}, timeSpent: 0, timeEstimate: 0, projectId: 'INBOX', ...o });
window.store = {
  tasks: [
    base({ id: 't1', title: '买牛奶', timeSpentOnDay: { [today]: 600000 }, timeSpent: 600000, dueDay: today }),
    base({ id: 't2', title: '看书', isDone: true, doneOn: Date.now(), projectId: 'p1', tagIds: ['tg1'], timeSpentOnDay: { [today]: 45 * 60000 }, timeSpent: 45 * 60000, dueDay: today }),
  ],
  archived: [],
  projects: [{ id: 'INBOX', title: 'Inbox', taskIds: ['t1'] }, { id: 'p1', title: '学习', taskIds: ['t2'] }],
  tags: [{ id: 'TODAY', title: 'Today', taskIds: [] }, { id: 'tg1', title: '学习', taskIds: ['t2'] }],
  counters: { c1: { id: 'c1', title: '喝水', type: 'ClickCounter', isEnabled: true, countOnDay: { [today]: 2 } } },
  data: {},
};
const clone = (x) => JSON.parse(JSON.stringify(x));
const hooks = {};
window.fireHook = (name, payload) => (hooks[name] || []).forEach((fn) => fn(payload));

function recalc(t) { t.timeSpent = Object.values(t.timeSpentOnDay || {}).reduce((a, b) => a + b, 0); }

function makeApi(kind) {
  return {
    cfg: { theme: params.get('theme') || 'dark', appVersion: '19.1.0', platform: NATIVE ? 'android' : 'web' },
    Hooks: { CURRENT_TASK_CHANGE: 'currentTaskChange' },
    getTasks: async () => clone(store.tasks),
    getArchivedTasks: async () => clone(store.archived),
    getAllProjects: async () => clone(store.projects),
    getAllTags: async () => clone(store.tags),
    addTag: async (t) => { const id = 'tag' + seq++; store.tags.push({ id, title: t.title, taskIds: [] }); return id; },
    addProject: async (p) => { const id = 'p' + seq++; store.projects.push({ id, title: p.title, taskIds: [] }); return id; },
    addTask: async (d) => { const id = 'n' + seq++; const t = base({ ...d, id }); if (d.dueDay === undefined) delete t.dueDay; store.tasks.push(t); return id; },
    updateTask: async (id, patch) => {
      const t = store.tasks.find((x) => x.id === id);
      if (!t) throw new Error('Task not found');
      Object.assign(t, patch);
      if (patch.timeSpentOnDay) recalc(t);
    },
    deleteTask: async (id) => { store.tasks = store.tasks.filter((x) => x.id !== id); },
    dispatchAction: (a) => { window.__log.actions.push(a); },
    getAppState: async () => ({ simpleCounters: clone(store.counters) }),
    incrementCounter: async (id, by) => { const c = store.counters[id]; c.countOnDay[today] = (c.countOnDay[today] || 0) + by; return c.countOnDay[today]; },
    registerHook: (name, fn) => { (hooks[name] = hooks[name] || []).push(fn); },
    persistDataSynced: async (data, key) => { store.data[key || ''] = data; },
    loadSyncedData: async (key) => store.data[key || ''] ?? null,
    showSnack: (cfg) => { window.__log.snacks.push(cfg.msg); },
    notify: async () => {},
    registerHeaderButton: () => {},
    showIndexHtmlAsView: () => { window.__log.views++; },
    openDialog: async (cfg) => { window.__log.dialogs.push({ title: cfg.title, html: cfg.htmlContent, buttons: cfg.buttons.map((b) => b.label) }); const a = window.__dialogAnswer; window.__dialogAnswer = null; return a || undefined; },
    request: async (url, opts) => {
      window.__log.proxy++;
      const r = await window.__nodeFetch(url, { method: opts.method, headers: opts.headers, body: opts.body });
      if (r.status < 200 || r.status >= 300) throw new Error('Http failure response: ' + r.status);
      return r.text;
    },
    kind,
  };
}
window.makePluginApi = () => makeApi('iframe');

(async () => {
  const [html, bg] = await Promise.all([hostFetch('/plugin/index.html').then((r) => r.text()), hostFetch('/plugin/plugin.js').then((r) => r.text())]);
  if (params.get('bg') !== '0') {
    const hostApi = makeApi('host');
    new Function('plugin', 'PluginAPI', "'use strict';\n" + bg)(hostApi, hostApi);
  }
  const inject = '<script>window.PluginAPI = window.parent.makePluginApi();<\/script>';
  document.getElementById('f').srcdoc = html.replace(/<head[^>]*>/i, (m) => m + inject);
})();
</script>
</body>
</html>
